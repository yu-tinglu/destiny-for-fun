<style>
:root{--face:#c0c0c0;--hi:#fff;--lo:#404040;--sh:#808080}
*{box-sizing:border-box}
html{background:#008080}
body{margin:0;min-height:100vh;background:#008080;background-image:radial-gradient(rgba(255,255,255,.12) 1px,transparent 1.5px);background-size:22px 22px;color:#000;font-family:"標楷體","DFKai-SB","BiauKai","Kaiti TC","STKaiti","KaiTi","cwTeX Q Kai","Noto Serif TC","Noto Serif CJK TC",serif;font-size:20px;padding:6px 6px 64px;-webkit-tap-highlight-color:transparent}
a{color:inherit}
.win{max-width:780px;margin:8px auto;background:var(--face);border:2px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);box-shadow:1px 1px 0 #000,4px 4px 0 rgba(0,0,0,.35);padding:3px}
.tb{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-weight:bold;padding:3px 4px 3px 8px;display:flex;align-items:center;gap:4px;font-size:18px}
.tb .ttl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{width:24px;height:22px;background:var(--face);color:#000;border:2px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);display:flex;align-items:center;justify-content:center;font:bold 13px/1 Arial,sans-serif;text-decoration:none;cursor:default}
.menubar{padding:3px 8px;font-size:17px;display:flex;gap:16px;border-bottom:1px solid var(--sh)}
.body{padding:8px}
.pane{background:#fffdf2;border:2px solid;border-color:var(--sh) var(--hi) var(--hi) var(--sh);padding:12px;line-height:1.55;margin:8px 0}
.center{text-align:center}
.small{font-size:16px}
.btn{font:inherit;font-size:20px;background:var(--face);color:#000;border:2px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);box-shadow:inset -1px -1px var(--sh),inset 1px 1px #dfdfdf;padding:6px 16px;margin:4px;cursor:pointer;text-decoration:none;display:inline-block}
.btn:active{border-color:var(--lo) var(--hi) var(--hi) var(--lo);box-shadow:inset 1px 1px var(--sh)}
.btn.big{font-size:26px;font-weight:bold;padding:10px 28px}
.btn:disabled{color:#808080;text-shadow:1px 1px #fff}
select,input{font:inherit;font-size:18px;border:2px solid;border-color:var(--sh) var(--hi) var(--hi) var(--sh);background:#fff;padding:4px 6px;max-width:100%}
input[type=text]{width:100%}
label{display:inline-block;margin:4px 8px 4px 0}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;justify-content:center}
.mq{background:#000;color:#3f3;border:2px inset #808080;overflow:hidden;white-space:nowrap;margin:8px 0;padding:2px 0;font-size:18px}
.mq span{display:inline-block;padding-left:100%;animation:sjmq 26s linear infinite}
@keyframes sjmq{to{transform:translateX(-100%)}}
.blink{animation:sjbl 1s steps(2,start) infinite}
@keyframes sjbl{to{visibility:hidden}}
.odo{display:inline-block;background:#000;color:#f33;font:bold 18px/1 "Courier New",monospace;padding:3px 6px;letter-spacing:3px;border:2px inset #888}
/* desktop icons */
.icons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.ico{cursor:pointer;display:block;text-align:center;padding:10px 2px 8px;border:2px dotted transparent;text-decoration:none;color:#000}
.ico:hover,.ico:focus,.ico:active{border-color:#000;background:rgba(0,0,128,.12)}
.ico .e{font-size:46px;display:block;line-height:1.25;filter:drop-shadow(2px 2px 0 rgba(0,0,0,.3))}
.ico .l{font-size:21px;font-weight:bold}
/* zhuyin */
.z{display:inline-flex;align-items:center;white-space:pre}
.z i.p{display:inline-flex;align-items:center;font-style:normal;font-size:.46em;line-height:1;margin-left:.06em;font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;font-weight:normal;color:#333}
.z i.p b{display:flex;flex-direction:column;align-items:center;font-weight:normal}
.z i.p s{text-decoration:none;display:block;line-height:1.08}
.z i.p b.zt{margin-left:.04em;font-size:1.05em}
.z i.p s.d{line-height:.6}
body.nozy .z i.p{display:none}
body:not(.nozy) .pane,body:not(.nozy) .paper{line-height:1.9}
.nozy-cell .z i.p{display:none}
/* WordArt */
.wa{font-weight:900;line-height:1.15;padding:6px 0 10px;text-align:center;font-style:italic;letter-spacing:.02em;--sh2:#222;user-select:none}
.wa .z{-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;background-image:var(--g);-webkit-text-stroke:1.2px var(--sh2);filter:drop-shadow(1px 1px 0 var(--sh2)) drop-shadow(2px 2px 0 var(--sh2)) drop-shadow(3px 3px 0 var(--sh2)) drop-shadow(5px 7px 4px rgba(0,0,0,.4))}
.wa .z i.p{font-size:.25em;-webkit-text-fill-color:#fff;-webkit-text-stroke:0;font-style:normal;color:#fff;font-weight:bold}
.wa1{--g:linear-gradient(180deg,#ff2a2a 0%,#ffb100 24%,#fff200 44%,#27d13a 64%,#1b6bff 84%,#a21cff 100%);--sh2:#3b0a52}
.wa2{--g:linear-gradient(180deg,#fffbd0 0%,#ffd84a 38%,#a87000 52%,#ffe27a 74%,#9a6200 100%);--sh2:#4a2c00}
.wa3{--g:linear-gradient(180deg,#f0f8ff 0%,#7fb7ff 42%,#1e3a8a 54%,#8cc4ff 100%);--sh2:#0a1740}
.wa4{--g:linear-gradient(180deg,#fff200 0%,#ff9500 50%,#e60000 100%);--sh2:#4a0000}
.wa5{--g:linear-gradient(180deg,#f0ffd8 0%,#7dff4d 48%,#0a8a2a 100%);--sh2:#032a0f}
.wa6{--g:linear-gradient(180deg,#ffffff 0%,#ff9be0 48%,#d11a8b 100%);--sh2:#4a0a33}
.wa7{--g:linear-gradient(180deg,#e8d8ff 0%,#a66bff 48%,#3a0ca3 100%);--sh2:#150338}
.sm{font-size:clamp(26px,7vw,38px)}
/* tables, paper */
.tbl{width:100%;border-collapse:collapse;margin:8px 0}
.tbl th,.tbl td{border:2px solid #8b5a2b;padding:4px 6px;text-align:center;background:#fff8e1}
.tbl th{background:#f0d9a8;width:22%}
.tbl.t5 th{width:auto}
.tbl.fix{table-layout:fixed}
.gb{border:2px solid #8b5a2b;background:#fff8e1;padding:6px 10px;margin:6px 0}
.gh{display:flex;flex-wrap:wrap;align-items:center;gap:2px 14px;border-bottom:1px dashed #8b5a2b;margin-bottom:3px;font-size:21px}
.paper{background:#fff6dc;border:3px double #a0522d;padding:12px;margin-top:12px;animation:sjpop .5s ease-out}
@keyframes sjpop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.poem p{margin:4px 0;font-size:25px;letter-spacing:.08em;font-weight:bold;color:#7a1409}
.grade{display:inline-block;font-size:26px;font-weight:bold;padding:2px 14px;border:3px solid #7a1409;color:#7a1409;background:#ffe9b0;transform:rotate(-3deg);margin:4px}
.stars{color:#e0a000;letter-spacing:2px;font-family:Arial,sans-serif;font-size:22px}
.stars .off{color:#bbb}
.tag{display:inline-block;background:#000080;color:#fff;padding:0 8px;margin:2px;font-size:18px}
.tag.r{background:#a00}
.lbl{display:inline-block;min-width:3.4em;font-weight:bold}
/* tube */
.tube{width:176px;margin:6px auto;transform-origin:50% 90%}
.tube.shake .pop{animation:sjpop .5s ease-in-out infinite}@keyframes sjpop{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.tube.shake{animation:sjshake .25s linear infinite}
@keyframes sjshake{0%{transform:rotate(-12deg) translateY(0)}25%{transform:rotate(10deg) translateY(-8px)}50%{transform:rotate(-9deg) translateY(0)}75%{transform:rotate(12deg) translateY(-8px)}100%{transform:rotate(-12deg)}}
/* jiao */
.beans{display:flex;justify-content:center;gap:30px;height:150px;align-items:flex-end;padding-bottom:12px}
.bean{width:92px;height:58px;border-radius:50% 50% 46% 46%/78% 78% 28% 28%;transform:rotate(var(--r,0deg));position:relative;box-shadow:3px 5px 0 rgba(0,0,0,.3)}
.bean.round{background:radial-gradient(circle at 35% 28%,#ff9a8a,#d4281a 55%,#7a0f08);border:2px solid #4a0905}
.bean.flat{background:linear-gradient(180deg,#9e1c10,#c4301f);border:2px solid #4a0905;border-radius:46% 46% 46% 46%/40% 40% 40% 40%}
.bean.flat::after{content:"";position:absolute;left:14%;right:14%;top:44%;height:3px;background:rgba(0,0,0,.35);box-shadow:0 8px 0 rgba(0,0,0,.25),0 -8px 0 rgba(0,0,0,.25)}
.bean.toss{animation:sjtoss 1.1s ease-in-out}
@keyframes sjtoss{0%{transform:translateY(0) rotate(0)}45%{transform:translateY(-120px) rotate(560deg)}100%{transform:translateY(0) rotate(var(--r,720deg))}}
/* tarot */
.cards{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.card{width:118px;height:190px;perspective:700px}
.card .in{position:relative;width:100%;height:100%;transition:transform .9s;transform-style:preserve-3d}
.card.flip .in{transform:rotateY(180deg)}
.card .f,.card .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:3px double #e8c15a;border-radius:8px;box-shadow:3px 4px 0 rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.card .b{background:repeating-linear-gradient(45deg,#2b1055,#2b1055 8px,#3d1a78 8px,#3d1a78 16px);color:#e8c15a;font-size:44px}
.card .f{background:linear-gradient(180deg,#fff7dc,#f1dca0);transform:rotateY(180deg);padding:4px;line-height:1.2}
.card .f.rev .c{transform:rotate(180deg)}
.tcw{display:flex;flex-direction:column;align-items:center;width:118px}.tcap{font-size:13px;text-align:center;margin-top:4px;line-height:1.3}.card{height:197px}.card .f{padding:0;overflow:hidden;background:#f1dca0}.card .f img{width:100%;height:100%;display:block;object-fit:fill}.card .f.rev img{transform:rotate(180deg)}
.card .c{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;width:100%}
.card .no{font-size:15px;font-family:"Times New Roman",serif;color:#7a1409;font-weight:bold}
.card .sy{font-size:52px;line-height:1.15}
.card .nm{font-size:20px;font-weight:bold}
.card .en{font-size:12px;font-family:"Times New Roman",serif}
.pos{font-weight:bold;color:#000080}
/* zodiac */
.zg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.zb{font:inherit;text-align:center;padding:6px 0;background:var(--face);border:2px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);cursor:pointer;color:#000}
.zb.on{border-color:var(--lo) var(--hi) var(--hi) var(--lo);background:#ffe27a}
.zb .sy{font-size:30px;display:block;line-height:1.2;font-family:"Segoe UI Symbol","Noto Sans Symbols","Apple Symbols",sans-serif}
.zb .nm{font-size:16px}
/* ziwei */
.zw{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,auto);border:2px solid #000;background:#000;gap:1px;margin:8px 0}
.zc{background:#fffdf2;min-height:92px;padding:2px 3px;font-size:14px;line-height:1.25;position:relative;display:flex;flex-direction:column}
.zc .br{font-size:13px;color:#555}
.zc .pn{font-weight:bold;color:#a00;font-size:15px}
.zc .st{font-weight:bold;font-size:16px;color:#000080;margin-top:2px}
.zc .st.k{color:#7a1409}
.zc .mk{position:absolute;right:2px;top:2px;font-size:12px;background:#a00;color:#fff;padding:0 3px}
.zc.me{background:#ffeeb0}
.zc .mu{font-style:normal;background:#a00;color:#fff;font-size:11px;padding:0 2px;margin-left:2px}
.zc .st small{font-size:11px;color:#666;font-weight:normal;margin-left:1px}
.zc .ms{font-size:12px;color:#335;line-height:1.3;margin-top:2px}
.zc .dr{font-size:11px;color:#777;margin-top:auto}
.zmid{grid-column:2/4;grid-row:2/4;background:#fff8e1;padding:8px;font-size:15px;line-height:1.5;display:flex;flex-direction:column;justify-content:center;text-align:center}
/* hex */
.hx{width:150px;margin:8px auto}
.hl{height:16px;margin:8px 0;display:flex;gap:16px;position:relative}
.hl i{flex:1;background:#222;display:block}
.hl.yin i:first-child{flex:1}
.hl.yang i:nth-child(2){display:none}
.hl.yang i:first-child{flex:1}
.hl em{position:absolute;right:-28px;top:-6px;font:bold 20px/1 Arial;color:#c00;font-style:normal}
.hl.gap{visibility:hidden}
.hl.yang{gap:0}
/* ball */
.ball{width:200px;height:200px;margin:8px auto;border-radius:50%;background:radial-gradient(circle at 35% 28%,#8fa0ff 0%,#2b2d9c 36%,#080a3a 80%);box-shadow:inset -10px -14px 30px rgba(0,0,0,.6),4px 8px 0 rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;color:#cfe;position:relative}
.ball.shake{animation:sjshake .22s linear infinite}
.ball .ans{width:110px;text-align:center;font-size:22px;font-weight:bold;color:#fff;text-shadow:0 0 8px #8cf;line-height:1.25;animation:sjpop .6s ease-out}
.base{width:120px;height:18px;background:#222;border-radius:50%;margin:-6px auto 6px}
/* new tools */
.stone{width:96px;height:96px;border-radius:46% 54% 48% 52%/52% 46% 54% 48%;background:radial-gradient(circle at 35% 30%,#707070,#262626 72%);color:#ffd45a;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Segoe UI Historic","Noto Sans Runic","Segoe UI Symbol",serif;box-shadow:3px 5px 0 rgba(0,0,0,.4);animation:sjpop .5s ease-out}
.stone .rn{font-size:48px;line-height:1.1}
.stone .rl{font-size:12px;font-family:Arial,sans-serif;color:#ddd}
.chips{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:8px 0}
.chip{font:inherit;font-size:17px;background:#fff;border:2px solid #8b5a2b;padding:0 10px;cursor:pointer;color:#000}
.chip:active{background:#ffe27a}
/* layout safety for long translated text */
.win,.body,.pane,.paper,.intro{min-width:0;overflow-wrap:anywhere}
.ico .l{overflow-wrap:anywhere;hyphens:auto;line-height:1.15}
label{max-width:100%}
select{min-width:0;max-width:62vw;text-overflow:ellipsis}
.tbl td,.tbl th{overflow-wrap:anywhere}
.row{min-width:0}
body:not([data-lang=zh-TW]):not([data-lang=zh-HK]) .ico .l{font-size:16px}
body:not([data-lang=zh-TW]):not([data-lang=zh-HK]) .btn{font-size:18px}
body:not([data-lang=zh-TW]):not([data-lang=zh-HK]) .btn.big{font-size:21px;padding:8px 18px}
/* fonts by language */
body[data-lang=en],body[data-lang=fr],body[data-lang=es],body[data-lang=id],body[data-lang=vi],body[data-lang=ru]{font-family:"Times New Roman",Times,"Liberation Serif","Noto Serif",serif}
body[data-lang=ja]{font-family:"MS Mincho","ＭＳ 明朝","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif}
body[data-lang=ko]{font-family:"Batang","바탕","AppleMyungjo","Noto Serif KR","Noto Serif CJK KR",serif}
body[data-lang=hi]{font-family:"Mangal","Kokila","Noto Serif Devanagari","Nirmala UI",serif}
body[data-lang=th]{font-family:"Angsana New","TH Sarabun New","Noto Serif Thai","Tahoma",serif;font-size:1.12em}
body[data-lang=en],body[data-lang=fr],body[data-lang=es],body[data-lang=id],body[data-lang=vi],body[data-lang=ru]{font-size:1.06em}
body[data-lang=en] .wa,body[data-lang=fr] .wa,body[data-lang=es] .wa,body[data-lang=id] .wa,body[data-lang=vi] .wa,body[data-lang=ru] .wa{font-family:Impact,"Arial Black","Haettenschweiler","Times New Roman",sans-serif;font-weight:400;letter-spacing:.04em}
select,input,.btn,button{font-family:inherit}
.intro{background:#fff8d6;border:2px solid #a0522d;padding:6px 10px;margin:6px 0 10px;font-size:17px;line-height:1.6}
.intro summary{cursor:pointer;font-weight:bold;font-size:19px;color:#7a1409}
.intro p{margin:6px 0}
.mtw{visibility:hidden}
.dsel select{max-width:30vw;margin:0 1px}
#mtbar{display:none;background:#fff3c4;color:#000;border-bottom:2px solid #a0522d;padding:4px 10px;font-size:15px;font-family:Arial,sans-serif}
/* topbar / lang / desk */
#topbar{position:sticky;top:0;z-index:25;height:38px;background:linear-gradient(90deg,#000080,#1084d0);color:#fff;display:flex;align-items:center;gap:8px;padding:0 8px;font-weight:bold;font-size:18px;border-bottom:2px solid #000}
#topbar .sp2{flex:1}


.tube{position:relative}

.dropstick i{display:block;width:100%;height:100%;border:1px solid #7a4a00;border-radius:2px;background:linear-gradient(#c4301f 0 14%,#f4d98a 14%)}
@keyframes sjdrop{0%{transform:translateY(0) rotate(0)}35%{transform:translateY(-70px) rotate(8deg)}100%{transform:translateY(260px) rotate(70deg);opacity:0}}

#sndbtn{padding:1px 8px}

const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function zyHTML(z){
  let tone='',L=z;const last=z[z.length-1];
  if('ˊˇˋ˙'.includes(last)){tone=last;L=z.slice(0,-1)}
  let h='<i class="p"><b class="zl">';
  if(tone==='˙')h+='<s class="d">˙</s>';
  for(const ch of L)h+='<s>'+ch+'</s>';
  h+='</b>';
  if(tone&&tone!=='˙')h+='<b class="zt">'+tone+'</b>';
  return h+'</i>';
}
const zc=(c,z)=>'<span class="z">'+c+(z?zyHTML(z):'')+'</span>';
function conv(t){
  const cs=[...t];let out='',i=0;
  while(i<cs.length){
    let hit=false;
    for(let n=4;n>=2&&!hit;n--){
      const w=cs.slice(i,i+n).join('');
      if(w.length===n&&WORDS[w]){for(let k=0;k<n;k++)out+=zc(cs[i+k],WORDS[w][k]);i+=n;hit=true}
    }
    if(hit)continue;
    const c=cs[i++];
    out+=isC(c)?zc(c,ZY[c]):esc(c);
  }
  return out;
}
const SKIP=new Set(['SCRIPT','STYLE','SELECT','OPTION','TEXTAREA','INPUT','TITLE']);
function annotate(root){
  if(LANG!=='zh-TW'&&LANG!=='')return;
  const list=[];
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  while(w.nextNode()){
    const n=w.currentNode;
    if(!/[㐀-鿿]/.test(n.nodeValue))continue;
    let skip=false;
    for(let p=n.parentNode;p&&p!==ROOT.parentNode;p=p.parentNode){
      if(p.nodeType!==1)continue;
      if(SKIP.has(p.tagName)||(p.classList&&(p.classList.contains('nozy-cell')||p.classList.contains('z')))){skip=true;break}
    }
    if(!skip)list.push(n);
  }
  list.forEach(n=>{const t=document.createElement('template');t.innerHTML=conv(n.nodeValue);n.replaceWith(t.content)});
}
function waveify(root,force){
  $$('.wa[data-shape]',root).forEach(el=>{
    if(el.dataset.done)return;
    if(!force&&mtOn()&&CJK.test(el.textContent))return;
    el.dataset.done=1;
    [...el.childNodes].forEach(n=>{
      if(n.nodeType===3){const f=document.createDocumentFragment();
        [...n.nodeValue].forEach(ch=>{const s=document.createElement('span');s.className='z';s.textContent=ch;f.append(s)});
        n.replaceWith(f)}
    });
    const u=[...el.children].filter(c=>c.classList.contains('z'));
    const N=u.length,shape=el.dataset.shape;
    u.forEach((c,i)=>{
      const t=N>1?i/(N-1):.5;let tr='';
      if(shape==='wave')tr=`translateY(${(Math.sin(t*Math.PI*2.4)*.16).toFixed(3)}em)`;
      else if(shape==='arch')tr=`translateY(${(-Math.sin(t*Math.PI)*.32+.12).toFixed(3)}em) rotate(${((t-.5)*26).toFixed(1)}deg)`;
      else if(shape==='slant')tr=`translateY(${((.5-t)*.5).toFixed(3)}em)`;
      else if(shape==='grow')tr=`scale(${(.78+t*.4).toFixed(3)})`;
      c.style.transform=tr;
    });
  });
}
function dsel(el){
  const loc=({'zh-TW':'zh-TW','zh-HK':'zh-HK'}[LANG]||LANG||'zh-TW')+'-u-ca-gregory-nu-latn';
  const F=(o)=>{try{return new Intl.DateTimeFormat(loc,o)}catch(e){return new Intl.DateTimeFormat('en',o)}};

  const ymd=/^(zh|ja|ko)/.test(LANG||'zh-TW');
  el.querySelectorAll('input[type=date]:not([data-ds])').forEach(inp=>{
    inp.dataset.ds='1';let val=inp.value||'';

    const sy=document.createElement('select'),sm=document.createElement('select'),sd=document.createElement('select');

    for(let y=2100;y>=1900;y--)opt(sy,y,fy.format(new Date(Date.UTC(y,5,15))));
    for(let m=1;m<=12;m++)opt(sm,m,fm.format(new Date(Date.UTC(2001,m-1,15))));
    for(let d=1;d<=31;d++)opt(sd,d,fd.format(new Date(Date.UTC(2001,0,d))));
    (ymd?[sy,sm,sd]:[sd,sm,sy]).forEach(x=>wrap.appendChild(x));
    const p2=n=>String(n).padStart(2,'0');
    const put=v=>{val=v||'';const m=val.match(/^(\d+)-(\d+)-(\d+)$/);sy.value=m?+m[1]:'';sm.value=m?+m[2]:'';sd.value=m?+m[3]:''};
    const emit=()=>{
      if(sy.value&&sm.value){const mx=new Date(+sy.value,+sm.value,0).getDate();if(+sd.value>mx)sd.value=mx}

    [sy,sm,sd].forEach(x=>x.addEventListener('change',emit));
    Object.defineProperty(inp,'value',{get:()=>val,set:v=>put(v),configurable:true});
    put(val);inp.style.display='none';inp.parentNode.insertBefore(wrap,inp);
  });
}

/* ===== 每個占卜的文化說明：[文化背景(中), 怎麼玩(中), culture(en), how(en)] ===== */
const INTRO={
qian:['求籤是華人廟宇最普遍的問神方式：信眾在神像前默念姓名、生辰與心事，搖動籤筒，掉出的竹籤對應一首籤詩。台灣常見的有觀音一百籤、媽祖六十甲子籤、關帝一百籤與月老籤；藥師殿常用觀音一百籤的籤詩，專門問健康與平安。','選一個籤本，心中誠懇默念你的問題，按「搖籤筒」。籤詩是比喻，不是直接答案；重點看大方向，並把它當作自我提醒。','Drawing fortune sticks is the most common way to consult a deity in Chinese temples. Worshippers silently state their name, birthday and worry, shake a tube, and the stick that falls matches a short poem. Popular sets include the 100 Guanyin lots, the 60 Mazu lots, the 100 Guandi lots and the Matchmaker-god lots; Medicine Buddha halls often use the Guanyin 100 poems to ask about health and peace.','Pick a set, think sincerely about your question and press the button. The poem is a metaphor, not a literal answer — read it for the general direction and treat it as a reminder.'],
jiao:['擲筊（擲杯）是向神明請示「是或否」的方式。兩片半月形木塊，一面平、一面凸：一平一凸為聖筊（同意），兩面都平為笑筊（再想想），兩面都凸為陰筊（不同意）。台灣廟宇求籤前後通常都會擲筊確認。','先在心中問一個「可以用是／否回答」的問題，再按擲筊。連續三次聖筊代表非常肯定。','Poe (moon-block) throwing is how people ask a deity a yes/no question in Taiwanese and Chinese temples. Two crescent-shaped blocks, flat on one side and round on the other: one of each means yes, two flat sides means laughing (think again), two round sides means no. It is usually done before and after drawing sticks.','Ask a yes/no question in your mind, then press the button. Three yes results in a row is a very strong yes.'],
yu:['「每日一語」像古人的座右銘與籤語：用一句溫柔的話，給今天的自己一點力量。華人傳統裡，開春寫春聯、新年抽福語，都是希望用好話帶來好運。','按「換一句」就會換一句小語，挑一句今天最想聽的就好。','A "daily phrase" works like an old motto or fortune-cookie line: one kind sentence to give today some strength. In Chinese tradition, writing spring couplets and drawing New Year blessings are ways of inviting good luck through good words.','Press the button for a new line and keep the one you most need to hear today.'],
ziwei:['紫微斗數是中國最完整的命盤推算術之一，相傳源自五代北宋的陳摶，以出生的年月日時排出十二宮與百餘顆星曜，看性格、事業、感情與人生階段。在台灣、香港與東南亞華人社會非常流行。','輸入西曆生日、出生時辰與性別，按「排盤」。先看「命宮」主星，再看事業、財帛、夫妻等宮位與四化。','Zi Wei Dou Shu ("Purple Star Astrology") is one of the most complete Chinese birth-chart systems, traditionally credited to the Taoist Chen Tuan of the Song era. Your birth year, month, day and hour place about a hundred stars across twelve "palaces" describing character, career, love and life stages. It is very popular in Taiwan, Hong Kong and Southeast Asia.','Enter your birth date, hour and gender, then press the button. Start with the main star in your Life Palace, then look at Career, Wealth and Spouse palaces and the four transformations.'],
tarot:['塔羅牌起源於十五世紀的義大利紙牌遊戲，十八世紀後被神祕學家賦予占卜意義。一副牌 78 張：22 張大阿爾克那代表人生重大主題，56 張小阿爾克那分成權杖、聖杯、寶劍、錢幣四個花色，分別對應行動、情感、思考與物質。','選擇牌陣（單張、三張、愛情或凱爾特十字），心中想著問題，按「洗牌抽牌」。逆位不一定是壞，常代表能量受阻或往內轉。','Tarot began as a 15th-century Italian card game; in the 18th century occultists gave the cards divinatory meanings. A deck has 78 cards: 22 Major Arcana for life\'s big themes and 56 Minor Arcana in four suits — Wands (action), Cups (emotion), Swords (thought) and Pentacles (material life).','Choose a spread (one card, three cards, love or Celtic Cross), keep your question in mind and press the button. A reversed card is not necessarily bad — it often means blocked or inward energy.'],
star:['西洋十二星座源自古巴比倫與希臘的黃道，把太陽一年走過的天空分成十二段，每段約 30 度，各有元素（火土風水）與性格象徵。你的「星座」就是你出生時太陽所在的那一段。','選你的生日（月與日），按「我是哪一個星座？」，或直接點十二星座看今天的運勢。','The twelve Western zodiac signs come from Babylonian and Greek astronomy: the sky the Sun crosses in a year is divided into twelve 30-degree sections, each linked to an element (fire, earth, air, water) and a temperament. Your sign is where the Sun stood when you were born.','Choose your birth month and day and press the button, or tap any of the twelve signs to see today\'s reading.'],
fortune:['每日運勢結合了華人「看日子」與西方星座運勢兩種習慣：古人用干支與黃曆擇日，現代人則看星座與生肖。本工具以你的生日與今天的日期產生當日的整體、愛情、事業與財運指數。','輸入生日，按「算算今天」。同一天、同一生日的結果固定，所以不用重複按。','Daily fortune blends two habits: the Chinese practice of "choosing the day" with the almanac, and Western horoscopes. Here your birthday and today\'s date produce an overall, love, career and money score for the day.','Enter your birthday and press the button. The same birthday on the same day always gives the same result, so there is no need to press repeatedly.'],
ball:['水晶球占卜（scrying）在歐洲已有數百年歷史，占卜者凝視水晶或水面，期待在其中看見影像或答案。現代最常見的是「神奇八號球」式的玩法：搖一搖，浮出一句回答。','心中想一個是非題，按「搖晃水晶球」，看球裡浮出的答案。','Crystal-ball gazing (scrying) has been practised in Europe for centuries: the seer stares into crystal or water hoping to see images or answers. The modern game is closer to the "Magic 8-Ball": shake it and a short reply floats up.','Think of a yes/no question and press the button to see the reply.'],
yi:['《易經》是中國最古老的經典之一，以陰（斷線）陽（連線）組成六十四卦，原本是周代的占筮書，後來成為儒家與道家的哲學基礎。一卦有卦辭，六條爻各有爻辭，變爻代表事情正在變化。','心中想著一件事，按「誠心搖卦」，會得到本卦（現況）與變卦（走向），再看卦辭與爻辭。','The I Ching (Book of Changes) is one of China\'s oldest classics. Broken (yin) and solid (yang) lines form 64 hexagrams; it began as a Zhou-dynasty divination manual and became a foundation of Confucian and Taoist thought. Each hexagram has a judgment, and each of its six lines has its own text; a "changing line" means the situation is in motion.','Think of a matter and press the button. You get a primary hexagram (the present) and a changed hexagram (where it is heading); read the judgment and line texts.'],
name:['華人姓名學常用「康熙字典」的筆畫數，把姓名分成天格、人格、地格、外格與總格「五格」，再配合數理吉凶判斷。這套方法由日本熊崎健翁在二十世紀初整理，傳到台灣後非常流行。','輸入姓與名，按「算筆畫」，看各格的筆畫與解說。','Chinese name analysis counts strokes using the Kangxi Dictionary and splits a name into five "grids" (heaven, person, earth, outer and total), each linked to a lucky or unlucky number. The method was systematised in Japan in the early 20th century and became very popular in Taiwan.','Type your surname and given name (Chinese characters) and press the button to see the strokes and meaning of each grid.'],
bazi:['八字（四柱）以出生的年、月、日、時各取一組天干地支，共八個字，再看五行強弱與大運。它源自唐宋的子平術，是華人命理最核心的方法之一。節氣（如立春）而不是農曆新年才是換年的界線。','輸入西曆生日、時辰與性別，按「排八字」，看日主、五行、藏干與大運。','BaZi ("Four Pillars") takes a heavenly stem and earthly branch from your birth year, month, day and hour — eight characters in all — then studies the balance of the five elements and your ten-year luck cycles. It grew out of Tang and Song "Zi Ping" methods and is central to Chinese fate analysis. The year changes at the solar term Start of Spring, not at Lunar New Year.','Enter your birth date, hour and gender and press the button to see your Day Master, elements, hidden stems and luck cycles.'],
chenggu:['稱骨算命相傳是唐代袁天罡所創：把出生的年、月、日、時各對應一個「骨重」，加起來得到總重，再對應一首批語，從「勞碌」到「富貴」共五十多個等級。','輸入西曆生日與時辰，按「來稱骨」。批語以輕鬆的心態看就好。','"Weighing the bones" is traditionally credited to the Tang-era Yuan Tiangang: the year, month, day and hour of birth each carry a weight; the total matches a short verse ranging from a life of toil to one of wealth, in more than fifty grades.','Enter your birth date and hour and press the button. Read the verse lightheartedly.'],
num:['生命靈數（數祕術）相傳源自古希臘哲學家畢達哥拉斯「萬物皆數」的想法。把生日的數字逐位相加，縮成 1 到 9（11、22、33 為大師數字），得到你的生命道路數。','輸入西曆生日，按「算靈數」。','Numerology traces back to Pythagoras\'s idea that "all things are number". Adding the digits of your birthday down to a single digit from 1 to 9 (11, 22 and 33 are "master numbers") gives your Life Path number.','Enter your birthday and press the button.'],
meihua:['梅花易數相傳是宋代邵雍所創，故事說他看見梅花枝頭兩隻麻雀爭枝墜地，由此起卦。它用時間或數字起卦，不需要銅錢，講求「隨時隨地、觸機而應」。','按「起卦」，會依現在的時間產生本卦、互卦與變卦。','Plum Blossom Numerology is traditionally attributed to Shao Yong of the Song dynasty; the story says he cast a hexagram after seeing two sparrows fall from a plum branch. It builds a hexagram from time or numbers, with no coins needed, and stresses responding to the moment.','Press the button and a primary, nuclear and changed hexagram are created from the current time.'],
dream:['《周公解夢》是華人最著名的夢書，相傳出自周公，其實是歷代民間夢占的集合。傳統認為夢是日有所思、夜有所夢，也可能預示吉凶；現代則多把它當作了解自己心情的線索。','輸入夢裡出現的關鍵詞（如：蛇、水、飛），按「解夢」。','"The Duke of Zhou\'s Dream Dictionary" is the best-known Chinese dream book. Credited to the Duke of Zhou, it is really a collection of folk dream lore through the ages. Tradition holds that dreams reflect daytime thoughts and may hint at fortune; today many read them as clues to one\'s feelings.','Type a keyword from your dream (snake, water, flying…) and press the button.'],
rune:['盧恩符文是古代日耳曼與北歐人使用的字母，最早見於二世紀。它既是文字，也被賦予神祕意義；現代常用 24 個「老弗薩克」符文做簡單占卜，每個符文代表一種力量或主題。','心中想著問題，按「抽符石」，抽到一個符文。','Runes are the alphabet of ancient Germanic and Norse peoples, first seen in the 2nd century. Besides writing, each rune carries a symbolic meaning; modern divination often uses the 24 Elder Futhark runes, each standing for a force or theme.','Hold your question in mind and press the button to draw one rune.'],
zx:['十二生肖以十二地支配十二種動物，是華人紀年與性格的共同語言。每年有「太歲」，與你的生肖相沖、相刑、相害或相合時，民間認為運勢會有變化，所以有「安太歲」的習俗。','選擇你的生肖或生日，按「看今年」，看今年的整體提醒。','The twelve zodiac animals pair the twelve earthly branches with twelve animals and form a shared language for years and personalities. Each year has a "Tai Sui" star; when it clashes with, harms or harmonises with your animal, folk belief says luck shifts — hence the custom of "pacifying Tai Sui".','Choose your animal or birthday and press the button to see this year\'s overview.'],
match:['華人看緣分常用生肖相合、八字合婚與星座元素。生肖有六合、三合與六沖的說法；八字合婚看日干日支的關係。西方則看星座元素與生命靈數。本工具把這五個面向綜合成一個分數。','輸入你與對方的生日，按「測緣分」。分數只是好玩，感情靠經營。','Chinese compatibility reading uses zodiac-animal harmony, BaZi matching and, in the West, sign elements and numerology. Animals have "six harmonies", "three harmonies" and "six clashes"; BaZi matching compares Day Stems and Branches. This tool blends five factors into one score.','Enter both birthdays and press the button. The score is for fun — relationships are built, not calculated.'],
almanac:['黃曆（通勝）是華人沿用兩千多年的曆書，記載節氣、每日宜忌、沖煞與吉時，用來選結婚、搬家、開業的好日子。內容以農曆與干支為基礎，台灣、香港都仍常用。','直接看今天的宜與忌，用「前一天／後一天」切換日期。','The Huangli (Tung Shing) is an almanac Chinese communities have used for over two thousand years, listing solar terms, daily do\'s and don\'ts, clashes and lucky hours for choosing wedding, moving and opening days. It is based on the lunar calendar and the stem-branch cycle and is still widely used in Taiwan and Hong Kong.','See today\'s lucky and unlucky activities and use the previous/next buttons to change the date.'],
blood:['血型性格說起源於日本，1927 年古川竹二提出血型與氣質有關，1970 年代由能見正比古普及，在日本、台灣與韓國非常流行，但科學上並沒有可靠證據支持。純粹當作聊天話題。','選擇你和對方的血型，按「看看配不配」。','The blood-type personality idea began in Japan: Takeji Furukawa proposed a link in 1927, and Masahiko Nomi popularised it in the 1970s. It is very popular in Japan, Taiwan and Korea, but there is no reliable scientific evidence for it. Treat it purely as conversation fun.','Choose both blood types and press the button.'],
palm:['手相學（掌紋占卜）在古印度、中國與古希臘都有悠久歷史。傳統上看生命線、智慧線、感情線與事業線，並比較兩手：左手代表先天，右手代表後天（慣用手）。','按「解說我的手相」，對照自己的手掌，看各條線的意思。','Palmistry has a long history in ancient India, China and Greece. Traditionally you read the life, head, heart and fate lines and compare both hands — the non-dominant hand shows what you were born with, the dominant hand what you have made of it.','Press the button and compare with your own palm to learn what each line means.'],
natal:['西洋占星術起源於古巴比倫，在古希臘羅馬發展成「本命星盤」：以出生那一刻天空的行星位置，描繪一個人的性格。太陽代表核心、月亮代表情緒、上升代表給人的第一印象。','輸入出生日期、時間與地點（可輸入世界任何城市），按「開始」。','Western astrology began in Babylon and developed in Greece and Rome into the natal chart, which describes a person by the positions of the planets at the moment of birth. The Sun stands for the core self, the Moon for emotions and the Ascendant for first impressions.','Enter your birth date, time and place (any city in the world) and press the button.'],
pyth:['姓名數字學源自畢達哥拉斯「萬物皆數」的概念，把英文字母對應 1 到 9：A=1、B=2…I=9，J 再從 1 開始。全名的總和是「天賦數」，母音是「心靈數」，子音是「人格數」。','輸入英文或拼音姓名（例如 Tina Lu），可加上生日，按「算算看」。','Name numerology comes from Pythagoras\'s idea that "all is number", mapping letters to 1–9 (A=1 … I=9, then J=1 again). The total of the full name is the Expression number, the vowels give the Soul Urge number and the consonants give the Personality number.','Type your name in the Latin alphabet (for example Tina Lu), optionally add your birthday, and press the button.'],
omikuji:['御神籤（おみくじ）是日本神社與寺院的求籤，起源於平安時代的籤占，據說今天的形式與慈惠大師良源有關。籤分大吉、中吉、小吉、吉、末吉、凶、大凶，抽到凶籤可以綁在樹枝或籤架上，把壞運留在神社。','心中默念願望，按「抽籤」。','Omikuji are paper fortunes drawn at Japanese shrines and temples. They grew out of Heian-period divination, and today\'s form is linked to the monk Ryōgen. Grades run from great blessing to great curse; a bad fortune can be tied to a branch or rack so the bad luck stays at the shrine.','Make a wish in your heart and press the button.'],
kyusei:['九星氣學是日本發展的占術，源自中國的「洛書九宮」與九星，江戶到明治時期在日本系統化。人的「本命星」由出生年（以立春為界）決定，每年九顆星在九個方位輪流飛行，用來看今年的運勢與吉方。','輸入西曆生日，按「算本命星」。','Nine Star Ki is a Japanese system developed from the Chinese "Luoshu" nine palaces and nine stars, systematised in Japan from the Edo to Meiji periods. Your Honmei (birth) star is set by your birth year, counted from the Start of Spring; each year the nine stars fly through nine directions, used to read the year and lucky directions.','Enter your birthday and press the button.'],
maya:['瑪雅人使用多種曆法，其中 260 天的「卓爾金曆」（Tzolk\'in）是神聖曆：20 個日符號與 13 個數字搭配循環，用來占卜與安排祭儀，在瓜地馬拉的高地瑪雅社群至今仍有人使用。','輸入西曆生日，按「查我的日符號」。','The Maya used several calendars; the 260-day Tzolk\'in is the sacred one: 20 day signs combine with 13 numbers in a repeating cycle, used for divination and ritual and still kept by some Highland Maya communities in Guatemala.','Enter your birthday and press the button.'],
vedic:['吠陀占星（Jyotish）是古印度的傳統占星，使用恆星黃道，並以「月亮」所在的 27 個月宿（Nakshatra）為核心。它還有獨特的「文希里大運」，把人生分成九個星體主導的階段，在印度至今仍用於婚配與擇日。','輸入出生日期、時間與地點（可輸入世界任何城市），按「開始」。','Vedic astrology (Jyotish) is India\'s traditional astrology. It uses the sidereal zodiac and centres on the Moon\'s position among 27 lunar mansions (Nakshatras). Its Vimshottari dasha system divides life into periods ruled by nine planets, and it is still used in India for marriage matching and choosing dates.','Enter your birth date, time and place (any city in the world) and press the button.'],
celt:['現代的凱爾特樹木曆把一年分成十三個樹木月，源自詩人羅伯特・格雷夫斯 1948 年的著作《白色女神》，他把古愛爾蘭歐甘字母與樹木連在一起。這是現代創作，並非古代凱爾特人的原始曆法，但很受自然靈性愛好者歡迎。','選擇你的生日（月與日），按「找我的守護樹」。','The modern Celtic tree calendar divides the year into thirteen tree months. It comes from Robert Graves\'s 1948 book The White Goddess, which linked the old Irish Ogham letters with trees. It is a modern creation rather than an ancient Celtic calendar, but it is popular with nature-spirituality fans.','Choose your birth month and day and press the button.'],
geo:['沙占卜（Geomancy，阿拉伯語 ʿilm al-raml）起源於八世紀前後的中東與北非，十二世紀傳入歐洲，曾是中世紀最流行的占卜之一。占卜者在沙上隨機畫四行點，得到四個「母圖」，再推演出 16 張圖，最後的「判官」就是答案。','心中想著問題（可輸入），按「起盤」。','Geomancy (Arabic ʿilm al-raml, "science of sand") arose in the Middle East and North Africa around the 8th century and reached Europe in the 12th, becoming one of the most popular medieval divinations. The diviner marks four random rows of dots to get four "Mothers", derives sixteen figures, and the final "Judge" is the answer.','Think of your question (you may type it) and press the button.'],
moon:['月亮的盈虧是人類最早的曆法與占卜依據：新月象徵開始，滿月象徵收穫。許多文化（農曆、伊斯蘭曆、占星術與農事曆）都依月相安排生活。月亮每約兩天半換一個星座。','選擇日期（預設今天），按「看月相」，也可以輸入生日看出生月相。','The waxing and waning Moon was humanity\'s earliest calendar and a basis for divination: new moon for beginnings, full moon for harvest. Many cultures — the lunar calendar, the Islamic calendar, astrology and farming almanacs — plan life by lunar phase. The Moon changes zodiac sign about every two and a half days.','Pick a date (today by default) and press the button; you can also enter your birthday to see your birth phase.']

let mtTimer=0,mtDown=0,mtQ=0,mtWait=[],mtBest=0;const mtErr={};const mtFly={};
function mtSave(){clearTimeout(mtTimer);mtTimer=setTimeout(()=>{try{const k=Object.keys(MTC);if(k.length>2500)k.slice(0,800).forEach(x=>delete MTC[x]);localStorage.setItem('sj_mt',JSON.stringify(MTC))}catch(e){}},800)}
function mtSlot(){return new Promise(r=>{if(mtQ<6){mtQ++;r()}else mtWait.push(r)})}
function mtFree(){mtQ--;const n=mtWait.shift();if(n){mtQ++;n()}}
async function mtOne(text,sl){
  const key=LANG+'|'+sl+'|'+text;
  if(MTC[key])return MTC[key];
  if(mtFly[key])return mtFly[key];
  if(Date.now()<mtDown)return null;
  return mtFly[key]=(async()=>{
    await mtSlot();
    try{
      let out=null;
      const sl2=sl==='zh-TW'?'zh-TW':sl,tl=MTL[LANG],q=encodeURIComponent(text);
      const EP=[
        async sig=>{const r=await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl='+sl2+'&tl='+tl+'&dt=t&q='+q,{signal:sig});if(!r.ok)throw new Error('g'+r.status);const j=await r.json();return j[0].map(x=>x[0]).join('')},
        async sig=>{const r=await fetch('https://clients5.google.com/translate_a/t?client=dict-chrome-ex&sl='+sl2+'&tl='+tl+'&q='+q,{signal:sig});if(!r.ok)throw new Error('c'+r.status);const j=await r.json();if(j.sentences)return j.sentences.map(x=>x.trans||'').join('');const f=Array.isArray(j)?j[0]:'';return Array.isArray(f)?f[0]:f},
        async sig=>{if(text.length>160)throw new Error('m-long');const r=await fetch('https://api.mymemory.translated.net/get?q='+q+'&langpair='+sl2+'|'+tl,{signal:sig});if(!r.ok)throw new Error('m'+r.status);const j=await r.json();if(j.responseStatus&&+j.responseStatus!==200)throw new Error('m'+j.responseStatus);return j.responseData.translatedText}];
      for(let k=0;k<EP.length&&!out;k++){
        const i=(k+mtBest)%EP.length,ac=new AbortController(),tm=setTimeout(()=>ac.abort(),7000);
        try{out=await EP[i](ac.signal);if(out){mtBest=i}}catch(e){mtErr[i]=(e&&e.name==='AbortError')?'timeout':(e&&e.message)||'error'}
        finally{clearTimeout(tm)}
      }
      if(!out)throw new Error('empty');
      MTC[key]=out;mtSave();return out;
    }catch(e){mtDown=Date.now()+20000;return null}
    finally{mtFree();delete mtFly[key]}
  })();
}

}
let mtBusy=false,mtAgain=false;
async function mtPass(root){
  if(!mtOn())return;
  if(mtBusy){mtAgain=true;return}
  mtBusy=true;
  try{
    const items=[];
    const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
    while(w.nextNode()){const n=w.currentNode,p=n.parentNode;if(!p||p.tagName==='SCRIPT'||p.tagName==='STYLE')continue;if(p.closest&&p.closest('[data-mt],.dsel'))continue;if(CJK.test(n.nodeValue)){if(p.closest&&p.closest('svg')){n.nodeValue='✦';continue}items.push(['t',n,'zh-TW'])}}
    root.querySelectorAll('[data-mt]:not([data-mtd])').forEach(e=>items.push(['m',e,'en']));
    root.querySelectorAll('[placeholder],[title]').forEach(e=>['placeholder','title'].forEach(a=>{const v=e.getAttribute(a);if(v&&CJK.test(v))items.push(['a',e,'zh-TW',a])}));
    if(items.length){
      const hid=new Set();items.forEach(it=>{const pe=it[1].nodeType===3?it[1].parentElement:it[1];const w=pe&&(pe.closest('.paper,.pane,.intro,.mq,.tb,.center,.body')||pe);if(w){w.classList.add('mtw');hid.add(w)}});
      const unhide=()=>hid.forEach(w=>w.classList.remove('mtw'));const failsafe=setTimeout(unhide,9000);
      let failed=false;
      await Promise.all(items.map(async it=>{
        const [k,n,sl,a]=it;
        const raw=k==='t'?n.nodeValue:k==='m'?n.textContent:n.getAttribute(a),t=raw.trim();
        if(!t)return;
        const o=await mtOne(t,sl);
        if(o===null){failed=true;return}
        if(k==='t'){const m=raw.match(/^(\s*)[\s\S]*?(\s*)$/);n.nodeValue=m[1]+o+m[2]}
        else if(k==='m'){n.textContent=o;n.dataset.mtd='1'}
        else n.setAttribute(a,o);
      }));
      clearTimeout(failsafe);unhide();
      mtBanner(failed);
    }
  }finally{mtBusy=false}
  waveify(root,true);
  if(mtAgain){mtAgain=false;mtPass(root)}
}

function ziwei(ly,lm,ld,hi){
  const stem=mod(ly-4,10),br=mod(ly-4,12);
  const monthPos=mod(2+lm-1,12);
  const ming=mod(monthPos-hi,12),shen=mod(monthPos+hi,12);
  const s0=[2,4,6,8,0][stem%5];
  const stemOf=b=>(s0+mod(b-2,12))%10;
  const ms=stemOf(ming);let n=0;
  for(let i=0;i<60;i++)if(i%10===ms&&i%12===ming){n=i;break}
  const ny=NAYIN[Math.floor(n/2)];
  const ju={金:4,木:3,水:2,火:6,土:5}[ny[1]];
  let x=0;while((ld+x)%ju!==0)x++;
  const q=(ld+x)/ju,base=mod(q+1,12);
  const zw=x%2?mod(base-x,12):mod(base+x,12);
  const at={};
  const put=(nm,b)=>{(at[mod(b,12)]=at[mod(b,12)]||[]).push(nm)};
  const Z={紫微:0,天機:-1,太陽:-3,武曲:-4,天同:-5,廉貞:-8};
  const T={天府:0,太陰:1,貪狼:2,巨門:3,天相:4,天梁:5,七殺:6,破軍:10};
  const tf=mod(4-zw,12);
  Object.keys(Z).forEach(k=>put(k,zw+Z[k]));
  Object.keys(T).forEach(k=>put(k,tf+T[k]));
  return{stem,br,ming,shen,stemOf,ny,ju,zw,at,ly,lm,ld,hi};
}

function relE(a,b){

function grids(S,G){

}

<label>第二個數字 <input type="number" id="n2" min="1" max="999" value="" style="width:5em"></label></div>
<p class="small center">數字隨心所欲，想到什麼寫什麼。</p>
<div class="center"><button class="btn big" id="go">起卦</button></div></div>
<div id="out"></div>${backBtn}`,
mount(r){
  const out=$('#out',r);
  $('#go',r).onclick=()=>{
    const mode=$('input[name=m]:checked',r).value;
    let up,lo,mv,how;
    if(mode==='t'){
      const now=new Date(),l=lunarOf(now),yb=mod(l.y-4,12)+1,hb=Math.floor(((now.getHours()+1)%24)/2)+1;
      const a=yb+l.m+l.d;
      up=triOf(a);lo=triOf(a+hb);mv=mod(a+hb-1,6)+1;
      how=`以現在時間（農曆${lunarText(l)}・${BR[hb-1]}時）起卦`;
    }else{
      const a=parseInt($('#n1',r).value,10),b=parseInt($('#n2',r).value,10);
      if(!(a>0)||!(b>0)){out.innerHTML='<div class="pane center">請先填入兩個數字。</div>';refresh(out);return}
      up=triOf(a);lo=triOf(b);mv=mod(a+b-1,6)+1;how=`以數字 ${a}、${b} 起卦`;
    }
    const L=hexLines(lo,up),A=hexFrom(L);
    const L2=L.slice();L2[mv-1]=L2[mv-1]?0:1;const C=hexFrom(L2);
    const Hh=hexFrom([L[1],L[2],L[3],L[2],L[3],L[4]]);
    const card=(tag,x)=>`<p><span class="lbl">${tag}</span><b>${x.h[0]}卦</b>（上${x.up}下${x.lo}）：${x.h[3]}。</p>`;
    const YA=YJM[A.h[0]];
    const orig=YA?`<p><span class="lbl">卦辭</span>${YA[1]}</p><p><span class="lbl">動爻辭</span><b>${yname(mv-1,L[mv-1])}</b>：${YA[3][mv-1]}</p>`:'';
    out.innerHTML=`<div class="paper center"><p class="small">${how}</p>
    ${wa(A.h[0]+'卦','wa4','wave','clamp(46px,14vw,72px)')}${hexDraw(L,mv)}
    <p>第 <b>${cn(mv)}</b> 爻是動爻（○）。</p>
    <div style="text-align:left">${card('本卦・現況',A)}${orig}${card('互卦・過程',Hh)}${card('變卦・結果',C)}</div>
    <p class="small" style="text-align:left">※ 依邵雍梅花易數的起卦法簡化，卦辭與爻辭取自公有領域的《易經》，沒有細論體用生剋，僅供娛樂參考。</p></div>`;
    refresh(out);out.scrollIntoView({behavior:'smooth',block:'start'});
  };
}};

const inPair=(L,a,b)=>L.some(p=>p.includes(a)&&p.includes(b));
function relB(a,b){
  const d=a!==b;
  return{zhi:!d,chong:mod(a+6,12)===b,he6:d&&inPair(HE6,a,b),he3:d&&HE3.some(g=>g.includes(a)&&g.includes(b)),hai:d&&inPair(HAI,a,b),po:d&&inPair(PO,a,b),

}

    const lp=q=>{let n=sumd(q.replace(/-/g,''));while(n>9&&n!==11&&n!==22)n=sumd(n);return n>9&&n!==11&&n!==22?sumd(n):n};
    const n1=lp(s1),n2=lp(s2),r1=n1>9?sumd(n1):n1,r2=n2>9?sumd(n2):n2;

    }else{

  };
  const refreshHand=()=>{$('#phtxt',r).innerHTML=handTxt()};
  ['psex','pdom','phs','prule'].forEach(i=>$('#'+i,r).onchange=refreshHand);refreshHand();
  const setTab=b=>{$('#modeA',r).style.display=b?'none':'';$('#modeB',r).style.display=b?'':'none';$('#palmHint',r).style.display=b?'none':'';out.innerHTML=''};
  $('#tabA',r).onclick=()=>setTab(false);$('#tabB',r).onclick=()=>setTab(true);
  const COL={life:'#c0392b',head:'#1e5fbf',heart:'#d4408c',career:'#2e8b2e'};
  const cv=$('#pc',r),cx=cv.getContext('2d'),st={img:null,cal:[],str:{life:[],head:[],heart:[],career:[]},cur:null};
  const redraw=()=>{cx.clearRect(0,0,cv.width,cv.height);if(st.img)cx.drawImage(st.img,0,0,cv.width,cv.height);
    st.cal.forEach((p,i)=>{cx.fillStyle='#fff';cx.strokeStyle='#000';cx.beginPath();cx.arc(p[0],p[1],7,0,7);cx.fill();cx.stroke();cx.fillStyle='#000';cx.font='bold 12px sans-serif';cx.fillText(i?'指根':'手腕',p[0]+9,p[1]+4)});
    Object.keys(st.str).forEach(k=>st.str[k].forEach(a=>{cx.strokeStyle=COL[k];cx.lineWidth=4;cx.lineCap='round';cx.lineJoin='round';cx.beginPath();a.forEach((p,i)=>i?cx.lineTo(p[0],p[1]):cx.moveTo(p[0],p[1]));cx.stroke()}))};
  const step=()=>{const e=$('#pstep',r);e.style.display='';
    e.innerHTML=st.cal.length===0?'<b>第 1 步：</b>點一下照片上「手腕正中央」的位置。':st.cal.length===1?'<b>第 2 步：</b>再點一下「中指根部」（中指與手掌相連處）。':'<b>第 3 步：</b>選一條線，用手指在照片上沿著那條線描出來；一條線可以描多段（斷開就分段描）。四條都描完（沒有的線可以不描）後按「解讀我的照片」。';

  $('#pf',r).onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const w=Math.min(340,im.width),h=Math.round(im.height*w/im.width);cv.width=w;cv.height=h;cv.style.display='';st.img=im;st.cal=[];Object.keys(st.str).forEach(k=>st.str[k]=[]);redraw();step()};im.src=URL.createObjectURL(f)};

  cv.onpointerdown=e=>{if(!st.img)return;e.preventDefault();const p=pos(e);if(st.cal.length<2){st.cal.push(p);redraw();step();return}
    const k=$('input[name=pl]:checked',r).value;st.cur=[p];st.str[k].push(st.cur);try{cv.setPointerCapture(e.pointerId)}catch(_){}};
  cv.onpointermove=e=>{if(!st.cur)return;e.preventDefault();st.cur.push(pos(e));redraw()};
  const up=()=>{if(st.cur&&st.cur.length<4){const k=$('input[name=pl]:checked',r).value;st.str[k]=st.str[k].filter(a=>a!==st.cur)}st.cur=null;redraw()};
  cv.onpointerup=up;cv.onpointercancel=up;

  $('#preset',r).onclick=()=>{st.cal=[];Object.keys(st.str).forEach(k=>st.str[k]=[]);redraw();step()};

  $('#pgo',r).onclick=()=>{
    if(st.cal.length<2)return;
    const [w,f]=st.cal,H=Math.hypot(f[0]-w[0],f[1]-w[1])||1,ux=(f[0]-w[0])/H,uy=(f[1]-w[1])/H;
    // 手掌座標：y 沿手腕→指根方向（0..1 為手掌高度），x 為垂直方向
    const T=p=>{const dx=p[0]-w[0],dy=p[1]-w[1];return [(dx*-uy+dy*ux)/H,(dx*ux+dy*uy)/H]};
    const len=a=>{let L=0;for(let i=1;i<a.length;i++)L+=Math.hypot(a[i][0]-a[i-1][0],a[i][1]-a[i-1][1]);return L/H};
    const info=k=>{const S=st.str[k].filter(a=>a.length>3);if(!S.length)return null;
      const main=S.reduce((m,a)=>len(a)>len(m)?a:m,S[0]);const q=main.map(T);

    if(!L){pick.life=1;notes.push('沒有描出生命線，無法判斷；以「短而淺」的說明供參考。')}
    else pick.life=L.n>=2?2:(L.len>=0.6?0:1);
    // 智慧線
    if(!Hd){pick.head=0;notes.push('沒有描出智慧線，無法判斷；以「平直」的說明供參考。')}
    else{const a=Hd.q,sorted=a.slice().sort((p,q2)=>p[0]-q2[0]);const dy=sorted[sorted.length-1][1]-sorted[0][1];
      const tip=Math.abs(dy)<0.1?'flat':'bent';
      pick.head=Hd.n>=2?3:Hd.mlen<0.45?2:(tip==='flat'?0:1)}
    // 感情線
    if(!Ht){pick.heart=1;notes.push('沒有描出感情線，無法判斷；以「平直」的說明供參考。')}
    else{const a=Ht.q,sorted=a.slice().sort((p,q2)=>p[0]-q2[0]);
      // 末端取離拇指較遠、靠手掌外緣的一側：以 x 絕對值較大的端點為末端
      const e=Math.abs(a[0][0])>Math.abs(a[a.length-1][0])?a[0]:a[a.length-1],s2=e===a[0]?a[a.length-1]:a[0];const dy=e[1]-s2[1];
      let wig=0;for(let i=2;i<a.length;i+=3){const d1=a[i][1]-a[i-1][1],d0=a[i-1][1]-a[i-2][1];if(d1*d0<0)wig++}
      pick.heart=wig>=Math.max(6,a.length/6)?3:dy>0.08?0:dy<-0.08?2:1}

    if(!C)pick.career=2;else pick.career=C.n>=2?1:(C.chord/(C.mlen||1)>=0.85?0:3);
    out.innerHTML=`<div class="paper"><div class="center">${wa('照片判讀','wa2','wave')}</div>
    <p class="small">${handTxt()}</p><p class="small">以下是依你描出的線條（長度、走向、是否分段）所做的推測，不是網站「看」出來的，描得越準越有參考價值。</p>
    ${['life','head','heart','career'].map(k=>{const o=PALM[k][2][pick[k]];return`<p><span class="lbl">${PALM[k][0]}</span><b>${o[0]}</b>：${o[1]}</p>`}).join('')}
    ${notes.map(n=>`<p class="small">${n}</p>`).join('')}
    <p class="small">※ 掌紋會隨年齡與使用習慣改變，左右手也不同；手相解說為傳統民俗說法的簡化整理，僅供娛樂參考。想要更完整的判讀，可以把照片貼給 Claude。</p></div>`;
    refresh(out);out.scrollIntoView({behavior:'smooth',block:'start'});
  };
  $('#go',r).onclick=()=>{
    out.innerHTML=`<div class="paper"><div class="center">${wa('你的掌紋','wa2','wave')}</div><p class="small">${handTxt()}</p>${Object.keys(PALM).map(k=>{const i=+$(`select[data-k=${k}]`,r).value,o=PALM[k][2][i];return`<p><span class="lbl">${PALM[k][0]}</span><b>${o[0]}</b>：${o[1]}</p>`}).join('')}

    refresh(out);out.scrollIntoView({behavior:'smooth',block:'start'});
  };
}};

let GEO=[];
function tzOff(tz,ms){
  try{const f=new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric'}),p={};
    f.formatToParts(new Date(ms)).forEach(x=>p[x.type]=+x.value);
    return (Date.UTC(p.year,p.month-1,p.day,p.hour,p.minute,p.second)-Math.floor(ms/1000)*1000)/60000}catch(e){return null}
}
function localToUtc(Y,M,D,h,mi,tz){
  const g=Date.UTC(Y,M-1,D,h,mi);let o=tzOff(tz,g);if(o===null)return null;
  const u=g-o*60000;o=tzOff(tz,u);return g-o*60000;
}

function readBirth(r){
  const ds=$('#dt',r).value;if(!ds)return null;store.set('birth',ds);
  const [Y,M,D]=ds.split('-').map(Number),[h,mi]=($('#tm',r)?$('#tm',r).value||'12:00':'12:00').split(':').map(Number);
  let lon=121.56,lat=25.04,tz='Asia/Taipei',name='台北 Taipei',off=null;
  if($('#ct',r)){
    const clon=$('#clon',r).value,clat=$('#clat',r).value;
    if(clon!==''&&clat!==''){lon=+clon;lat=+clat;name='自訂座標 ('+lat+', '+lon+')';tz=null;off=$('#ctz',r).value!==''?+$('#ctz',r).value:Math.round(lon/15)}
    else{const v=$('#ct',r).value;
      if(v[0]==='g'){const g=GEO[+v.slice(1)];lon=g.longitude;lat=g.latitude;tz=g.timezone||null;name=[g.name,g.country].filter(Boolean).join('，');if(!tz)off=Math.round(lon/15)}
      else{const c=CITY[+v.slice(1)];lon=c[1];lat=c[2];tz=c[3];name=c[0]}}
  }
  let ms=tz?localToUtc(Y,M,D,h||0,mi||0,tz):null;
  if(ms===null){if(off===null)off=Math.round(lon/15);ms=Date.UTC(Y,M-1,D,h||0,mi||0)-off*3600000}
  const offUsed=Math.round((Date.UTC(Y,M-1,D,h||0,mi||0)-ms)/60000)/60;
  return{Y,M,D,h:h||0,mi:mi||0,lon,lat,city:name,date:new Date(ms),tzTxt:'UTC'+(offUsed>=0?'+':'')+offUsed};
}

function chartOf(b){
  const t=ASTRO.MakeTime(b.date),t2=ASTRO.MakeTime(new Date(b.date.getTime()+86400000));
  const g=(n,tt)=>n==='Sun'?ASTRO.SunPosition(tt).elon:n==='Moon'?ASTRO.EclipticGeoMoon(tt).lon:ASTRO.Ecliptic(ASTRO.GeoVector(n,tt,true)).elon;
  const lons=WPE.map(n=>mod(g(n,t),360)),l2=WPE.map(n=>mod(g(n,t2),360));
  const retro=lons.map((l,i)=>i>1&&mod(l2[i]-l+180,360)-180<0);
  const T=t.ut/36525,rad=Math.PI/180,eps=(23.439291-0.0130042*T)*rad;
  const ramc=mod(ASTRO.SiderealTime(t)*15+b.lon,360)*rad,la=b.lat*rad;
  const asc=mod(Math.atan2(Math.cos(ramc),-(Math.sin(ramc)*Math.cos(eps)+Math.tan(la)*Math.sin(eps)))/rad,360);
  const mc=mod(Math.atan2(Math.sin(ramc),Math.cos(ramc)*Math.cos(eps))/rad,360);
  const node=mod(125.04452-1934.136261*T,360);
  const yr=2000+t.ut/365.25,ay=23.853+(yr-2000)*0.013972;
  return{t,lons,retro,asc,mc,node,ay};
}

<div class="pane center"><input type="text" id="nm" maxlength="40" placeholder="例如：Tina Lu"><br><label>生日（選填） <input type="date" id="dt"></label><br><button class="btn big" id="go">算算看</button></div>
<div id="out"></div>${backBtn}`,
mount(r){
  const out=$('#out',r);
  $('#go',r).onclick=()=>{
    const raw=$('#nm',r).value.trim(),nm=raw.toUpperCase().replace(/[^A-Z]/g,'');
    if(nm.length<2){out.innerHTML='<div class="pane center">請輸入至少兩個英文字母的姓名。</div>';refresh(out);return}
    const all=[...nm],sm=a=>a.reduce((s,c)=>s+pyv(c),0);
    const vow=all.filter(c=>PY_V.includes(c)),con=all.filter(c=>!PY_V.includes(c));
    const ex=pyRed(sm(all)),so=pyRed(sm(vow)),pe=pyRed(sm(con));
    const words=raw.toUpperCase().split(/\s+/).map(w=>w.replace(/[^A-Z]/g,'')).filter(Boolean);
    const steps=words.map(w=>`<b>${w}</b>：${[...w].map(c=>c+'<sub>'+pyv(c)+'</sub>').join(' + ')} = ${sm([...w])}`).join('<br>');
    const row=(lbl,n,what,how)=>{const L=lnx(n);return`<div style="border-top:1px dashed #a0522d;margin-top:8px;padding-top:6px"><p><span class="lbl">${lbl}</span><b style="font-size:26px;color:#a00">${n}</b>　${n>9&&![11,22,33].includes(n)?'':'（'+L[0]+'）'}</p><p>${what}</p><p>你的特質：${L[1]}</p><p>要留意：${L[2]}</p><p class="small">${how}</p></div>`};
    let life='',lp=0;
    const ds=$('#dt',r).value;
    if(ds){const [Y,M,D]=ds.split('-').map(Number);const m=pyRed(M),d=pyRed(D),y=pyRed(sumd(Y));lp=pyRed(m+d+y);const bn=pyRed(D),cy=new Date().getFullYear(),py=pyRed(pyRed(M)+pyRed(D)+pyRed(sumd(cy)));
      life=row('生命道路',lp,'由生日算出的「人生主軸」，代表你這一生要學習的課題與走的路。',`月 ${M}→${m}、日 ${D}→${d}、年 ${Y}→${y}，相加 ${m+d+y} → ${lp}`)+row('生日數',bn,'你出生的「日」帶來的天賦，是一份隨身的小禮物。',`${D} → ${bn}`)+`<div style="border-top:1px dashed #a0522d;margin-top:8px;padding-top:6px"><p><span class="lbl">${cy} 流年</span><b style="font-size:26px;color:#a00">${py}</b></p><p>${PYT[py>9?sumd(py):py]}</p></div>`}
    const cnt=Array(10).fill(0);all.forEach(c=>cnt[pyv(c)]++);
    const miss=[1,2,3,4,5,6,7,8,9].filter(n=>!cnt[n]),strong=[1,2,3,4,5,6,7,8,9].filter(n=>cnt[n]>=3);
    out.innerHTML=`<div class="paper"><div class="center">${wa(raw.toUpperCase(),'wa1','wave','clamp(26px,8vw,46px)')}</div>
    ${note('<b>怎麼算：</b>A=1、B=2 … I=9，J 再從 1 開始（J=1…R=9、S=1…Z=8）。把全名的字母數字加起來，一直縮成 1～9（11、22、33 是特殊的「大師數字」，不再縮）。')}
    <p class="small nozy-cell">${steps}</p>
    ${row('天賦數',ex,'全名所有字母相加，代表你的天賦、才能與要發揮的方向，也是別人最常看到你的「人生使命」。',`全名總和 ${sm(all)} → ${ex}`)}
    ${row('心靈數',so,'只算母音（A E I O U），代表你內心真正的渴望與動機，自己最清楚、別人未必看得出來。',`母音 ${vow.join('')||'—'} = ${sm(vow)} → ${so}`)}
    ${row('人格數',pe,'只算子音，代表別人眼中的你，也是你給人的第一印象與外在形象。',`子音 ${con.join('')||'—'} = ${sm(con)} → ${pe}`)}
    ${life}
    <div style="border-top:1px dashed #a0522d;margin-top:8px;padding-top:6px"><p><span class="lbl">缺少的數字</span>${miss.length?miss.map(n=>n+'（'+LN[n][0]+'）').join('、')+'：這些是名字裡沒有的能量，也是人生比較需要刻意練習的功課。':'1～9 都有，能量相當完整。'}</p>
    ${strong.length?`<p><span class="lbl">特別強的數字</span>${strong.map(n=>n+'（'+LN[n][0]+'）').join('、')}：出現 3 次以上，這項特質非常突出。</p>`:''}</div>
    <p class="small">※ 字母對應採畢達哥拉斯制；11、22、33 為特殊的大師數字；僅供娛樂參考。</p></div>`;
    refresh(out);out.scrollIntoView({behavior:'smooth',block:'start'});
  };
}};

function mayaKin(Y,M,D){const d=Math.floor(Date.UTC(Y,M-1,D)/86400000)+2440588-2456283;const tone=mod(3+d,13)+1,sign=mod(19+d,20);let n=0;for(let k=1;k<=260;k++)if((k-1)%13+1===tone&&(k-1)%20===sign){n=k;break}return{tone,sign,n}}

    const nm=ASTRO.SearchMoonPhase(0,d,40).date,fm=ASTRO.SearchMoonPhase(180,d,40).date,fq=ASTRO.SearchMoonPhase(90,d,40).date,lq=ASTRO.SearchMoonPhase(270,d,40).date;
    const L=LUNAR.Solar.fromYmd(Y,M,D).getLunar();
    const days=x=>Math.max(0,Math.round((x-d)/86400000));
    let birth='';
    const bd=$('#bd',r).value;
    if(bd){const [y,m,dd]=bd.split('-').map(Number),bp=ASTRO.MoonPhase(new Date(y,m-1,dd,12)),bi=Math.floor(mod(bp+22.5,360)/45);birth=sec('你的出生月相')+P_('出生月相',`${MPH[bi][1]} <b>${MPH[bi][0]}</b>：${MPB[bi]}。`)+P_('出生月亮',`月亮在${SIGNS[sgn(ASTRO.EclipticGeoMoon(new Date(y,m-1,dd,12)).lon)][1]}座（以正午估算，精確結果請用「西洋星盤」）`)}
    out.innerHTML=`<div class="paper center"><div style="font-size:72px" class="nozy-cell">${MPH[idx][1]}</div>${wa(MPH[idx][0],'wa3','wave','clamp(44px,13vw,72px)')}<p>${Y}/${M}/${D}（農曆 ${L.getMonthInChinese()}月${L.getDayInChinese()}）</p>
    <div style="text-align:left">
    ${note('<b>怎麼看：</b>月亮每個月從「新月」到「滿月」再回到「新月」。月相告訴你現在適合「開始、行動」還是「收成、放下」；月亮星座告訴你今天的情緒氛圍。')}
    ${P_('月相',`<b>${MPH[idx][0]}</b>，月亮被照亮 ${(ill*100).toFixed(0)}%，月齡約 ${age.toFixed(1)} 天。`)}
    ${P_('適合做的事',MPH[idx][2])}
    ${P_('月亮星座',MSG[sign])}
    ${sec('接下來的月相')}
    <table class="tbl fix nozy-cell" style="font-size:14px"><tr><th>月相</th><th>日期</th><th>還有</th></tr>
    <tr><td>🌑 新月</td><td>${fdate(nm)}</td><td>${days(nm)} 天</td></tr><tr><td>🌓 上弦月</td><td>${fdate(fq)}</td><td>${days(fq)} 天</td></tr>
    <tr><td>🌕 滿月</td><td>${fdate(fm)}</td><td>${days(fm)} 天</td></tr><tr><td>🌗 下弦月</td><td>${fdate(lq)}</td><td>${days(lq)} 天</td></tr></table>
    ${birth}
    <p class="small">※ 月相與月亮位置由 astronomy-engine（MIT）計算；日期採你裝置的時區；僅供娛樂參考。</p></div></div>`;
    refresh(out);out.scrollIntoView({behavior:'smooth',block:'start'});
  };
}};

/* ===== 記憶欄位、結果分享與占卜紀錄 ===== */
const MEMO=['tm','hr','sx','ct','clon','clat','ctz','sl','sm','sd'];
function memo(w){MEMO.forEach(id=>{const e=w.querySelector('#'+id);if(!e||e.tagName==='DIV')return;
  const v=store.get('f_'+id,null);if(v!==null){try{e.value=v}catch(_){}}
  e.addEventListener('change',()=>store.set('f_'+id,e.value))})}
const zyClean=t=>t.replace(/[ㄅ-ㄩˊˇˋ˙]/g,'').replace(/\n{3,}/g,'\n\n').trim();
function histGet(){try{return JSON.parse(store.get('hist','[]'))}catch(e){return[]}}

function domText(n){
  let out='';
  (function walk(e){
    for(const c of e.childNodes){
      if(c.nodeType===3){out+=c.nodeValue;continue}
      if(c.nodeType!==1)continue;
      const t=c.tagName;
      if(t==='RT'||t==='RP'||t==='SCRIPT'||t==='STYLE'||t==='SELECT'||t==='BUTTON'||t==='CANVAS'||t==='IMG'||c.classList.contains('b')||c.classList.contains('shr'))continue;
      if(t==='BR'){out+='\n';continue}
      walk(c);
      if(/^(P|DIV|H\d|LI|SUMMARY|TR|DETAILS)$/.test(t))out+='\n';
    }
  })(n);
  return out.replace(/[ \t]+\n/g,'\n');
}
function hookOut(w,id){
  const o=w.querySelector('#out');if(!o||id==='hist')return;
  new MutationObserver(()=>{clearTimeout(o._t);o._t=setTimeout(()=>{
    if(!o.textContent.trim()||o.querySelector('.shr'))return;
    const getT=()=>zyClean(domText(o));const text=getT(),name=(LIST.find(l=>l[0]===id)||[0,0,id])[2];
    const h=histGet(),sig=id+text.slice(0,80);
    if(!h.length||h[0].s!==sig){h.unshift({s:sig,id,n:name,t:Date.now(),x:text.slice(0,1500)});try{store.set('hist',JSON.stringify(h.slice(0,40)))}catch(_){}}
    const bar=document.createElement('div');bar.className='shr center nozy-cell';
    const full=name+'\n'+text+'\n— '+authName()+' 神機妙算占卜館';
    bar.innerHTML=`<button class="btn" type="button" data-c="1">${TR('複製結果')}</button> <button class="btn" type="button" data-s="1">${TR('分享')}</button> <button class="btn" type="button" data-i="1">${TR('存成圖片')}</button>`;
    bar.querySelector('[data-i]').onclick=()=>shareImg(name,text,o);
    bar.querySelector('[data-c]').onclick=e=>{try{navigator.clipboard.writeText(full)}catch(_){}e.target.textContent=TR('已複製')};
    const sb=bar.querySelector('[data-s]');
    if(navigator.share)sb.onclick=()=>navigator.share({title:name,text:full}).catch(()=>{});else sb.style.display='none';
    o.appendChild(bar);
  },700)}).observe(o,{childList:true});
}

function shareImg(name,text,o){
  const W=750,P=36,F='"BiauKai","DFKai-SB","標楷體","Noto Serif CJK TC",serif';
  const c=document.createElement('canvas'),x=c.getContext('2d');
  const body=text.split('\n').map(l=>l.trim()).filter(Boolean).join('\n').slice(0,700);
  x.font='28px '+F;
  const lines=[],maxw=W-2*P-24;
  body.split('\n').forEach(par=>{let cur='';for(const ch of par){if(x.measureText(cur+ch).width>maxw){lines.push(cur);cur=ch}else cur+=ch}lines.push(cur)});
  const imgs=[...o.querySelectorAll('.card .f img')].map(i=>({im:i,rev:i.parentNode.classList.contains('rev')}));
  const ch=imgs.length?250:0,LH=42,H=140+ch+lines.length*LH+110;
  c.width=W;c.height=H;
  x.fillStyle='#008080';x.fillRect(0,0,W,H);
  x.fillStyle='#c0c0c0';x.fillRect(16,16,W-32,H-32);
  const g=x.createLinearGradient(0,0,W,0);g.addColorStop(0,'#000080');g.addColorStop(1,'#1084d0');
  x.fillStyle=g;x.fillRect(22,22,W-44,56);
  x.fillStyle='#fff';x.font='bold 30px '+F;x.textBaseline='middle';x.fillText(name+'.exe',36,50);
  x.fillStyle='#fffdf0';x.fillRect(22,84,W-44,H-84-22);
  x.textBaseline='alphabetic';
  let y=108;
  x.fillStyle='#b3261e';x.font='bold 44px Impact,"Arial Black",sans-serif';
  x.lineWidth=5;x.strokeStyle='#2b0a5e';x.strokeText(name,P+4,y+40);x.fillText(name,P+4,y+40);y+=70;
  if(imgs.length){let px=P+4;const w=104,h=173;imgs.slice(0,7).forEach(it=>{try{x.save();x.translate(px+w/2,y+h/2);if(it.rev)x.rotate(Math.PI);x.drawImage(it.im,-w/2,-h/2,w,h);x.restore();x.strokeStyle='#8b5a2b';x.lineWidth=2;x.strokeRect(px,y,w,h)}catch(e){x.restore()}px+=w+10});y+=h+40}
  x.fillStyle='#222';x.font='28px '+F;
  lines.forEach(l=>{x.fillText(l,P+8,y);y+=LH});
  x.fillStyle='#666';x.font='22px Arial,sans-serif';x.fillText('© '+authName()+'  ・  神機妙算占卜館',P+8,H-44);
  c.toBlob(b=>{if(!b)return;const f=new File([b],'fortune.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f],title:name}).catch(()=>{});
    else{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='fortune.png';document.body.appendChild(a);a.click();a.remove()}},'image/png');
}
VIEWS.hist={t:'占卜紀錄.exe',render:()=>{const h=histGet();return `<div class="center">${wa('占卜紀錄','wa3','wave')}<p class="small">${TR('最近 40 筆結果，只存在這台裝置的瀏覽器裡。')}</p></div><div class="pane">${h.length?h.map((x,i)=>`<details><summary class="nozy-cell">${new Date(x.t).toLocaleString()}　${TR(x.n)}</summary><p style="white-space:pre-wrap">${x.x.replace(/[<>&]/g,'')}</p><textarea data-n="${i}" placeholder="${TR('後來怎麼樣了？寫下回顧備註')}" style="width:96%;height:60px">${(x.note||'').replace(/[<>&]/g,'')}</textarea></details>`).join(''):`<p class="center">${TR('還沒有紀錄。')}</p>`}${h.length?`<div class="center"><button class="btn" id="hclr" type="button">${TR('清除全部紀錄')}</button></div>`:''}</div>${backBtn}`},
mount(r){const b=$('#hclr',r);if(b)b.onclick=()=>{store.set('hist','[]');route()};$$('textarea[data-n]',r).forEach(t=>t.oninput=()=>{const h=histGet();if(h[+t.dataset.n]){h[+t.dataset.n].note=t.value;store.set('hist',JSON.stringify(h))}})}};


/* ===== 音效與開機畫面 ===== */
const SND={on:store.get('snd','1')==='1',c:null,
  ctx(){if(!this.c){try{this.c=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(this.c&&this.c.state==='suspended')try{this.c.resume()}catch(e){}return this.c},
  tone(f,t0,d,type,v){const c=this.ctx();if(!c||!this.on)return;try{const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+t0;o.type=type||'square';o.frequency.value=f;g.gain.setValueAtTime(v||.04,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.02)}catch(e){}},
  noise(t0){const c=this.ctx();if(!c||!this.on)return;try{const n=Math.floor(c.sampleRate*.05),b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=c.createBufferSource(),g=c.createGain();s.buffer=b;g.gain.value=.25;s.connect(g);g.connect(c.destination);s.start(c.currentTime+t0)}catch(e){}},
  click(){this.tone(880,0,.05)},
  chime(){[523,659,784,1047].forEach((f,i)=>this.tone(f,i*.12,.4,'triangle',.07))},
  rattle(){for(let i=0;i<12;i++)this.noise(i*.07)}};
function sndBtn(){const b=$('#sndbtn');b.textContent=SND.on?'🔊':'🔇'}
$('#sndbtn').onclick=e=>{e.stopPropagation();SND.on=!SND.on;store.set('snd',SND.on?'1':'0');sndBtn();if(SND.on)SND.click()};
sndBtn();

/* ===== 螢幕保護程式（閒置 60 秒）與彩蛋 ===== */
(function(){
  const ss=$('#ss'),cv=ss.querySelector('canvas');let raf=0,idle=0;
  const stars=[],words=['神','機','妙','算','占','卜','✦','吉'];
  function start(){if(!ss.hidden)return;ss.hidden=false;cv.width=innerWidth;cv.height=innerHeight;stars.length=0;
    for(let i=0;i<70;i++)stars.push({x:Math.random()*cv.width,y:Math.random()*cv.height,s:.6+Math.random()*2.2,w:words[i%words.length],h:Math.random()*360});
    const x=cv.getContext('2d');(function f(){x.fillStyle='rgba(0,0,0,.28)';x.fillRect(0,0,cv.width,cv.height);
      stars.forEach(a=>{a.y+=a.s;a.h=(a.h+1.5)%360;if(a.y>cv.height+30){a.y=-30;a.x=Math.random()*cv.width}
        x.fillStyle='hsl('+a.h+',90%,65%)';x.font=(14+a.s*10)+'px "標楷體",serif';x.fillText(a.w,a.x,a.y)});raf=requestAnimationFrame(f)})()}
  function stop(){if(ss.hidden)return;ss.hidden=true;cancelAnimationFrame(raf)}
  const reset=()=>{stop();clearTimeout(idle);idle=setTimeout(start,60000)};
  ['pointerdown','keydown','touchstart','scroll'].forEach(ev=>document.addEventListener(ev,reset,{passive:true}));
  ss.addEventListener('pointerdown',stop);reset();
  // 彩蛋：連點頂端標題 7 下，跳出舊版 Windows 錯誤視窗
  let n=0,tm=0;$('#sitename').addEventListener('click',()=>{n++;clearTimeout(tm);tm=setTimeout(()=>n=0,2000);
    if(n>=7){n=0;const d=document.createElement('div');d.className='errdlg nozy-cell';
      d.innerHTML='<div class="t">神機妙算占卜館</div><div class="m"><b>⚠</b><span>'+TR('運氣不足，請稍後再試。')+'<br><small>（Error 0x00FATE）</small></span></div><button class="btn" type="button">'+TR('確定')+'</button>';
      d.querySelector('button').onclick=()=>d.remove();ROOT.appendChild(d);SND.chime()}});
})();

function go(id){cur=id;closedAll=false;route()}
function route(){
  const id=cur;
  const v=VIEWS[id]||VIEWS.home;
  const w=document.createElement('div');w.className='win';
  w.innerHTML=`<div class="tb"><span class="ttl nozy-cell">${TR(v.t.replace(".exe",""))}.exe</span><a class="tbtn" data-act="min" tabindex="0" title="_">_</a><a class="tbtn" data-act="max" tabindex="0" title="□">□</a><a class="tbtn" data-act="close" tabindex="0" title="✕">✕</a></div><div class="body">${introHTML(id)}${v.render()}</div>`;
  app.replaceChildren(w);
  v.mount&&v.mount(w);
  memo(w);hookOut(w,id);
  refresh(w);
  winState='normal';applyWin();
  $('#menu').classList.remove('on');
  window.scrollTo(0,0);
}
function doAct(a){
  if(a==='min'){winState='min';applyWin()}
  else if(a==='max'){winState=winState==='max'?'normal':'max';applyWin()}
  else if(a==='close'){if(cur!=='home'){go('home')}else{closedAll=true;app.replaceChildren();applyWin()}}
}
$('#cur').onclick=()=>{if(closedAll)return;winState=winState==='min'?'normal':'min';applyWin()};

function setZy(on){store.set('zy',on?'1':'0');applyZy()}
function applyZy(){const zt=LANG==='zh-TW';ROOT.classList.toggle('nozy',!zyOn());$('#zytog').style.display=zt?'':'none';$('#zytog').textContent='ㄅㄆㄇ '+(zyOn()?'開':'關')}

$('#langbtn').onclick=e=>{e.stopPropagation();$('#langmenu').classList.toggle('on')};

$('#start').onclick=e=>{e.stopPropagation();$('#menu').classList.toggle('on')};
document.addEventListener('click',e=>{if(!e.target.closest('#menu'))$('#menu').classList.remove('on')});
$('#zytog').onclick=()=>setZy(!zyOn());
ROOT.addEventListener('click',e=>{
