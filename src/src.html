<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>神機妙算占卜館</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=cwTeX+Q+Kai&display=swap">
<style>
:root{--face:#c0c0c0;--hi:#fff;--lo:#404040;--sh:#808080}
*{box-sizing:border-box}
html{background:#008080}
body{margin:0;min-height:100vh;background:#008080;background-image:radial-gradient(rgba(255,255,255,.12) 1px,transparent 1.5px);background-size:22px 22px;color:#000;font-family:"標楷體","DFKai-SB","BiauKai","Kaiti TC","STKaiti","KaiTi","cwTeX Q Kai","Noto Serif TC","Noto Serif CJK TC",serif;font-size:20px;padding:6px 6px 64px;-webkit-tap-highlight-color:transparent}
a{color:inherit}
.win{max-width:780px;margin:8px auto;background:var(--face);border:2px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);box-shadow:1px 1px 0 #000,4px 4px 0 rgba(0,0,0,.35);padding:3px}
.tb{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-weight:bold;padding:3px 4px 3px 8px;display:flex;align-items:center;gap:4px;font-size:18px}
.tb .ttl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{width:24px;height:22px;background:var(--face);color:#000;border:2px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);display:flex;align-items:center;justify-content:center;font:bold 13px/1 Arial,sans-serif;text-decoration:none;cursor:default}
.menubar{padding:3px 8px;font-size:17px;display:flex;gap:16px;border-bottom:1px solid var(--sh)}
.body{padding:8px}
.pane{background:#fffdf2;border:2px solid;border-color:var(--sh) var(--hi) var(--hi) var(--sh);padding:12px;line-height:1.55;margin:8px 0}
.center{text-align:center}
.small{font-size:16px}
.btn{font:inherit;font-size:20px;background:var(--face);color:#000;border:2px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);box-shadow:inset -1px -1px var(--sh),inset 1px 1px #dfdfdf;padding:6px 16px;margin:4px;cursor:pointer;text-decoration:none;display:inline-block}
.btn:active{border-color:var(--lo) var(--hi) var(--hi) var(--lo);box-shadow:inset 1px 1px var(--sh)}
.btn.big{font-size:26px;font-weight:bold;padding:10px 28px}
.btn:disabled{color:#808080;text-shadow:1px 1px #fff}
select,input{font:inherit;font-size:18px;border:2px solid;border-color:var(--sh) var(--hi) var(--hi) var(--sh);background:#fff;padding:4px 6px;max-width:100%}
input[type=text]{width:100%}
label{display:inline-block;margin:4px 8px 4px 0}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;justify-content:center}
.mq{background:#000;color:#3f3;border:2px inset #808080;overflow:hidden;white-space:nowrap;margin:8px 0;padding:2px 0;font-size:18px}
.mq span{display:inline-block;padding-left:100%;animation:sjmq 26s linear infinite}
@keyframes sjmq{to{transform:translateX(-100%)}}
.blink{animation:sjbl 1s steps(2,start) infinite}
@keyframes sjbl{to{visibility:hidden}}
.odo{display:inline-block;background:#000;color:#f33;font:bold 18px/1 "Courier New",monospace;padding:3px 6px;letter-spacing:3px;border:2px inset #888}
/* desktop icons */
.icons{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ico{cursor:pointer;display:block;text-align:center;padding:10px 2px 8px;border:2px dotted transparent;text-decoration:none;color:#000}
.ico:hover,.ico:focus,.ico:active{border-color:#000;background:rgba(0,0,128,.12)}
.ico .e{font-size:46px;display:block;line-height:1.25;filter:drop-shadow(2px 2px 0 rgba(0,0,0,.3))}
.ico .l{font-size:21px;font-weight:bold}
/* zhuyin */
.z{display:inline-flex;align-items:center;white-space:pre}
.z i.p{display:inline-flex;align-items:center;font-style:normal;font-size:.46em;line-height:1;margin-left:.06em;font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;font-weight:normal;color:#333}
.z i.p b{display:flex;flex-direction:column;align-items:center;font-weight:normal}
.z i.p s{text-decoration:none;display:block;line-height:1.08}
.z i.p b.zt{margin-left:.04em;font-size:1.05em}
.z i.p s.d{line-height:.6}
body.nozy .z i.p{display:none}
body:not(.nozy) .pane,body:not(.nozy) .paper{line-height:1.9}
.nozy-cell .z i.p{display:none}
/* WordArt */
.wa{font-weight:900;line-height:1.15;padding:6px 0 10px;text-align:center;font-style:italic;letter-spacing:.02em;--sh2:#222;user-select:none}
.wa .z{-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;background-image:var(--g);-webkit-text-stroke:1.2px var(--sh2);filter:drop-shadow(1px 1px 0 var(--sh2)) drop-shadow(2px 2px 0 var(--sh2)) drop-shadow(3px 3px 0 var(--sh2)) drop-shadow(5px 7px 4px rgba(0,0,0,.4))}
.wa .z i.p{font-size:.25em;-webkit-text-fill-color:#fff;-webkit-text-stroke:0;font-style:normal;color:#fff;font-weight:bold}
.wa1{--g:linear-gradient(180deg,#ff2a2a 0%,#ffb100 24%,#fff200 44%,#27d13a 64%,#1b6bff 84%,#a21cff 100%);--sh2:#3b0a52}
.wa2{--g:linear-gradient(180deg,#fffbd0 0%,#ffd84a 38%,#a87000 52%,#ffe27a 74%,#9a6200 100%);--sh2:#4a2c00}
.wa3{--g:linear-gradient(180deg,#f0f8ff 0%,#7fb7ff 42%,#1e3a8a 54%,#8cc4ff 100%);--sh2:#0a1740}
.wa4{--g:linear-gradient(180deg,#fff200 0%,#ff9500 50%,#e60000 100%);--sh2:#4a0000}
.wa5{--g:linear-gradient(180deg,#f0ffd8 0%,#7dff4d 48%,#0a8a2a 100%);--sh2:#032a0f}
.wa6{--g:linear-gradient(180deg,#ffffff 0%,#ff9be0 48%,#d11a8b 100%);--sh2:#4a0a33}
.wa7{--g:linear-gradient(180deg,#e8d8ff 0%,#a66bff 48%,#3a0ca3 100%);--sh2:#150338}
.sm{font-size:clamp(26px,7vw,38px)}
/* tables, paper */
.tbl{width:100%;border-collapse:collapse;margin:8px 0}
.tbl th,.tbl td{border:2px solid #8b5a2b;padding:4px 6px;text-align:center;background:#fff8e1}
.tbl th{background:#f0d9a8;width:22%}
.tbl.t5 th{width:auto}
.tbl.fix{table-layout:fixed}
.gb{border:2px solid #8b5a2b;background:#fff8e1;padding:6px 10px;margin:6px 0}
.gh{display:flex;flex-wrap:wrap;align-items:center;gap:2px 14px;border-bottom:1px dashed #8b5a2b;margin-bottom:3px;font-size:21px}
.paper{background:#fff6dc;border:3px double #a0522d;padding:12px;margin-top:12px;animation:sjpop .5s ease-out}
@keyframes sjpop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.poem p{margin:4px 0;font-size:25px;letter-spacing:.08em;font-weight:bold;color:#7a1409}
.grade{display:inline-block;font-size:26px;font-weight:bold;padding:2px 14px;border:3px solid #7a1409;color:#7a1409;background:#ffe9b0;transform:rotate(-3deg);margin:4px}
.stars{color:#e0a000;letter-spacing:2px;font-family:Arial,sans-serif;font-size:22px}
.stars .off{color:#bbb}
.tag{display:inline-block;background:#000080;color:#fff;padding:0 8px;margin:2px;font-size:18px}
.tag.r{background:#a00}
.lbl{display:inline-block;min-width:3.4em;font-weight:bold}
/* tube */
.tube{width:170px;margin:6px auto;transform-origin:50% 90%}
.tube.shake{animation:sjshake .25s linear infinite}
@keyframes sjshake{0%{transform:rotate(-12deg) translateY(0)}25%{transform:rotate(10deg) translateY(-8px)}50%{transform:rotate(-9deg) translateY(0)}75%{transform:rotate(12deg) translateY(-8px)}100%{transform:rotate(-12deg)}}
/* jiao */
.beans{display:flex;justify-content:center;gap:30px;height:150px;align-items:flex-end;padding-bottom:12px}
.bean{width:92px;height:58px;border-radius:50% 50% 46% 46%/78% 78% 28% 28%;transform:rotate(var(--r,0deg));position:relative;box-shadow:3px 5px 0 rgba(0,0,0,.3)}
.bean.round{background:radial-gradient(circle at 35% 28%,#ff9a8a,#d4281a 55%,#7a0f08);border:2px solid #4a0905}
.bean.flat{background:linear-gradient(180deg,#9e1c10,#c4301f);border:2px solid #4a0905;border-radius:46% 46% 46% 46%/40% 40% 40% 40%}
.bean.flat::after{content:"";position:absolute;left:14%;right:14%;top:44%;height:3px;background:rgba(0,0,0,.35);box-shadow:0 8px 0 rgba(0,0,0,.25),0 -8px 0 rgba(0,0,0,.25)}
.bean.toss{animation:sjtoss 1.1s ease-in-out}
@keyframes sjtoss{0%{transform:translateY(0) rotate(0)}45%{transform:translateY(-120px) rotate(560deg)}100%{transform:translateY(0) rotate(var(--r,720deg))}}
/* tarot */
.cards{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.card{width:118px;height:190px;perspective:700px}
.card .in{position:relative;width:100%;height:100%;transition:transform .9s;transform-style:preserve-3d}
.card.flip .in{transform:rotateY(180deg)}
.card .f,.card .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:3px double #e8c15a;border-radius:8px;box-shadow:3px 4px 0 rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.card .b{background:repeating-linear-gradient(45deg,#2b1055,#2b1055 8px,#3d1a78 8px,#3d1a78 16px);color:#e8c15a;font-size:44px}
.card .f{background:linear-gradient(180deg,#fff7dc,#f1dca0);transform:rotateY(180deg);padding:4px;line-height:1.2}
.card .f.rev .c{transform:rotate(180deg)}
.card .c{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;width:100%}
.card .no{font-size:15px;font-family:"Times New Roman",serif;color:#7a1409;font-weight:bold}
.card .sy{font-size:52px;line-height:1.15}
.card .nm{font-size:20px;font-weight:bold}
.card .en{font-size:12px;font-family:"Times New Roman",serif}
.pos{font-weight:bold;color:#000080}
/* zodiac */
.zg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.zb{font:inherit;text-align:center;padding:6px 0;background:var(--face);border:2px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);cursor:pointer;color:#000}
.zb.on{border-color:var(--lo) var(--hi) var(--hi) var(--lo);background:#ffe27a}
.zb .sy{font-size:30px;display:block;line-height:1.2;font-family:"Segoe UI Symbol","Noto Sans Symbols","Apple Symbols",sans-serif}
.zb .nm{font-size:16px}
/* ziwei */
.zw{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,auto);border:2px solid #000;background:#000;gap:1px;margin:8px 0}
.zc{background:#fffdf2;min-height:92px;padding:2px 3px;font-size:14px;line-height:1.25;position:relative;display:flex;flex-direction:column}
.zc .br{font-size:13px;color:#555}
.zc .pn{font-weight:bold;color:#a00;font-size:15px}
.zc .st{font-weight:bold;font-size:16px;color:#000080;margin-top:2px}
.zc .st.k{color:#7a1409}
.zc .mk{position:absolute;right:2px;top:2px;font-size:12px;background:#a00;color:#fff;padding:0 3px}
.zc.me{background:#ffeeb0}
.zc .mu{font-style:normal;background:#a00;color:#fff;font-size:11px;padding:0 2px;margin-left:2px}
.zc .st small{font-size:11px;color:#666;font-weight:normal;margin-left:1px}
.zc .ms{font-size:12px;color:#335;line-height:1.3;margin-top:2px}
.zc .dr{font-size:11px;color:#777;margin-top:auto}
.zmid{grid-column:2/4;grid-row:2/4;background:#fff8e1;padding:8px;font-size:15px;line-height:1.5;display:flex;flex-direction:column;justify-content:center;text-align:center}
/* hex */
.hx{width:150px;margin:8px auto}
.hl{height:16px;margin:8px 0;display:flex;gap:16px;position:relative}
.hl i{flex:1;background:#222;display:block}
.hl.yin i:first-child{flex:1}
.hl.yang i:nth-child(2){display:none}
.hl.yang i:first-child{flex:1}
.hl em{position:absolute;right:-28px;top:-6px;font:bold 20px/1 Arial;color:#c00;font-style:normal}
.hl.gap{visibility:hidden}
.hl.yang{gap:0}
/* ball */
.ball{width:200px;height:200px;margin:8px auto;border-radius:50%;background:radial-gradient(circle at 35% 28%,#8fa0ff 0%,#2b2d9c 36%,#080a3a 80%);box-shadow:inset -10px -14px 30px rgba(0,0,0,.6),4px 8px 0 rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;color:#cfe;position:relative}
.ball.shake{animation:sjshake .22s linear infinite}
.ball .ans{width:110px;text-align:center;font-size:22px;font-weight:bold;color:#fff;text-shadow:0 0 8px #8cf;line-height:1.25;animation:sjpop .6s ease-out}
.base{width:120px;height:18px;background:#222;border-radius:50%;margin:-6px auto 6px}
/* new tools */
.stone{width:96px;height:96px;border-radius:46% 54% 48% 52%/52% 46% 54% 48%;background:radial-gradient(circle at 35% 30%,#707070,#262626 72%);color:#ffd45a;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Segoe UI Historic","Noto Sans Runic","Segoe UI Symbol",serif;box-shadow:3px 5px 0 rgba(0,0,0,.4);animation:sjpop .5s ease-out}
.stone .rn{font-size:48px;line-height:1.1}
.stone .rl{font-size:12px;font-family:Arial,sans-serif;color:#ddd}
.chips{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:8px 0}
.chip{font:inherit;font-size:17px;background:#fff;border:2px solid #8b5a2b;padding:0 10px;cursor:pointer;color:#000}
.chip:active{background:#ffe27a}
/* taskbar */
#bar{position:fixed;left:0;right:0;bottom:0;height:46px;background:var(--face);border-top:2px solid var(--hi);display:flex;align-items:center;gap:6px;padding:3px 6px;z-index:20;font-size:18px}
#bar .btn{margin:0;padding:3px 12px;font-size:19px}
#bar .sp{flex:1;border:2px solid;border-color:var(--sh) var(--hi) var(--hi) var(--sh);height:34px;display:flex;align-items:center;padding:0 8px;overflow:hidden;white-space:nowrap;font-size:17px}
#clock{border:2px solid;border-color:var(--sh) var(--hi) var(--hi) var(--sh);padding:4px 8px;font-size:17px;font-family:Arial,sans-serif}
#menu{position:fixed;left:6px;bottom:48px;width:240px;background:var(--face);border:2px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);box-shadow:3px 3px 0 rgba(0,0,0,.4);z-index:30;display:none;font-size:20px}
#menu.on{display:block}
#menu .side{background:linear-gradient(0deg,#000080,#1084d0);color:#fff;font-weight:bold;writing-mode:vertical-rl;transform:rotate(180deg);position:absolute;left:0;top:0;bottom:0;width:30px;text-align:center;padding:6px 0;font-size:20px}
#menu .list{margin-left:30px}
#menu a,#menu button{display:block;width:100%;text-align:left;padding:7px 10px;color:#000;text-decoration:none;background:none;border:0;font:inherit;cursor:pointer}
#menu a:hover,#menu button:hover{background:#000080;color:#fff}
#menu hr{border:0;border-top:1px solid var(--sh);border-bottom:1px solid var(--hi);margin:3px 2px}
</style>
</head>
<body>
<div id="shenji">
<div id="app"></div>
<div id="menu" class="nozy-cell"><div class="side">神機妙算</div><div class="list" id="menulist"></div></div>
<div id="bar" class="nozy-cell">
  <button class="btn" id="start"><b>✦ 開始</b></button>
  <div class="sp" id="cur">神機妙算占卜館</div>
  <button class="btn" id="zytog" title="注音開關">ㄅㄆㄇ 開</button>
  <div id="clock">--:--</div>
</div>
</div>
<script>
(function(){
/*STROKES*/
/*DICT*/
/*LIBS*/
const ROOT=document.getElementById('shenji');
const $=(s,r=ROOT)=>r.querySelector(s);
const $$=(s,r=ROOT)=>[...r.querySelectorAll(s)];
const app=$('#app');

/* ---------- 注音 ---------- */
const isC=c=>c>='㐀'&&c<='鿿';
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function zyHTML(z){
  let tone='',L=z;const last=z[z.length-1];
  if('ˊˇˋ˙'.includes(last)){tone=last;L=z.slice(0,-1)}
  let h='<i class="p"><b class="zl">';
  if(tone==='˙')h+='<s class="d">˙</s>';
  for(const ch of L)h+='<s>'+ch+'</s>';
  h+='</b>';
  if(tone&&tone!=='˙')h+='<b class="zt">'+tone+'</b>';
  return h+'</i>';
}
const zc=(c,z)=>'<span class="z">'+c+(z?zyHTML(z):'')+'</span>';
function conv(t){
  const cs=[...t];let out='',i=0;
  while(i<cs.length){
    let hit=false;
    for(let n=4;n>=2&&!hit;n--){
      const w=cs.slice(i,i+n).join('');
      if(w.length===n&&WORDS[w]){for(let k=0;k<n;k++)out+=zc(cs[i+k],WORDS[w][k]);i+=n;hit=true}
    }
    if(hit)continue;
    const c=cs[i++];
    out+=isC(c)?zc(c,ZY[c]):esc(c);
  }
  return out;
}
const SKIP=new Set(['SCRIPT','STYLE','SELECT','OPTION','TEXTAREA','INPUT','TITLE']);
function annotate(root){
  const list=[];
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  while(w.nextNode()){
    const n=w.currentNode;
    if(!/[㐀-鿿]/.test(n.nodeValue))continue;
    let skip=false;
    for(let p=n.parentNode;p&&p!==ROOT.parentNode;p=p.parentNode){
      if(p.nodeType!==1)continue;
      if(SKIP.has(p.tagName)||(p.classList&&(p.classList.contains('nozy-cell')||p.classList.contains('z')))){skip=true;break}
    }
    if(!skip)list.push(n);
  }
  list.forEach(n=>{const t=document.createElement('template');t.innerHTML=conv(n.nodeValue);n.replaceWith(t.content)});
}
function waveify(root){
  $$('.wa[data-shape]',root).forEach(el=>{
    if(el.dataset.done)return;el.dataset.done=1;
    [...el.childNodes].forEach(n=>{
      if(n.nodeType===3){const f=document.createDocumentFragment();
        [...n.nodeValue].forEach(ch=>{const s=document.createElement('span');s.className='z';s.textContent=ch;f.append(s)});
        n.replaceWith(f)}
    });
    const u=[...el.children].filter(c=>c.classList.contains('z'));
    const N=u.length,shape=el.dataset.shape;
    u.forEach((c,i)=>{
      const t=N>1?i/(N-1):.5;let tr='';
      if(shape==='wave')tr=`translateY(${(Math.sin(t*Math.PI*2.4)*.16).toFixed(3)}em)`;
      else if(shape==='arch')tr=`translateY(${(-Math.sin(t*Math.PI)*.32+.12).toFixed(3)}em) rotate(${((t-.5)*26).toFixed(1)}deg)`;
      else if(shape==='slant')tr=`translateY(${((.5-t)*.5).toFixed(3)}em)`;
      else if(shape==='grow')tr=`scale(${(.78+t*.4).toFixed(3)})`;
      c.style.transform=tr;
    });
  });
}
function refresh(el){annotate(el);waveify(el)}

/* ---------- 工具 ---------- */
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
const pick=(a,r=Math.random)=>a[Math.floor(r()*a.length)];
const ri=(n,r=Math.random)=>Math.floor(r()*n);
const todayKey=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const NUM='零一二三四五六七八九十';
const cn=n=>n<=10?NUM[n]:n<20?'十'+NUM[n-10]:NUM[Math.floor(n/10)]+'十'+(n%10?NUM[n%10]:'');
const mod=(a,n)=>((a%n)+n)%n;
const T=s=>String(s).replace(/[\u3400-\u9fff]/g,c=>S2T[c]||c);
const store={get(k,d){try{const v=localStorage.getItem('sj_'+k);return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem('sj_'+k,v)}catch(e){}}};
const stars=n=>'<span class="stars">'+'★'.repeat(n)+'<span class="off">'+'★'.repeat(5-n)+'</span></span>';
const STEMS='甲乙丙丁戊己庚辛壬癸',BR='子丑寅卯辰巳午未申酉戌亥';
const WEEK='日一二三四五六';
const LMON=['正','二','三','四','五','六','七','八','九','十','十一','臘'];
const LDAY=d=>d<=10?'初'+NUM[d%10===0?10:d]:d<20?'十'+NUM[d-10]:d===20?'二十':d<30?'廿'+NUM[d-20]:'三十';
function lunarOf(date){
  try{
    const l=LUNAR.Solar.fromYmd(date.getFullYear(),date.getMonth()+1,date.getDate()).getLunar();
    const m=l.getMonth();
    return{ok:true,y:l.getYear(),m:Math.abs(m),d:l.getDay(),leap:m<0};

function fortuneFor(seed){
  const r=rng(hash(seed));
  const total=40+ri(60,r);
  const o={total,love:1+ri(5,r),work:1+ri(5,r),money:1+ri(5,r),health:1+ri(5,r),color:pick(COLORS,r),num:1+ri(9,r),dir:pick(DIRS,r),word:pick(ADV,r)};
  const yi=[],ji=[];
  while(yi.length<2){const v=pick(YI_POOL,r);if(!yi.includes(v))yi.push(v)}
  while(ji.length<2){const v=pick(JI_POOL,r);if(!ji.includes(v))ji.push(v)}
  o.yi=yi;o.ji=ji;
  o.grade=total>=90?'大吉':total>=75?'吉':total>=60?'小吉':'平';
  return o;
}

function signOf(m,d){

  if(k<219)return 10;
  if(k<321)return 11;
  const th=[321,420,521,622,723,823,923,1024,1123];let idx=0;
  th.forEach((t,i)=>{if(k>=t)idx=i});
  return idx;
}

function ziwei(ly,lm,ld,hi){
  const stem=mod(ly-4,10),br=mod(ly-4,12);
  const monthPos=mod(2+lm-1,12);
  const ming=mod(monthPos-hi,12),shen=mod(monthPos+hi,12);
  const s0=[2,4,6,8,0][stem%5];
  const stemOf=b=>(s0+mod(b-2,12))%10;
  const ms=stemOf(ming);let n=0;
  for(let i=0;i<60;i++)if(i%10===ms&&i%12===ming){n=i;break}
  const ny=NAYIN[Math.floor(n/2)];
  const ju={金:4,木:3,水:2,火:6,土:5}[ny[1]];
  let x=0;while((ld+x)%ju!==0)x++;
  const q=(ld+x)/ju,base=mod(q+1,12);
  const zw=x%2?mod(base-x,12):mod(base+x,12);
  const at={};
  const put=(nm,b)=>{(at[mod(b,12)]=at[mod(b,12)]||[]).push(nm)};
  const Z={紫微:0,天機:-1,太陽:-3,武曲:-4,天同:-5,廉貞:-8};
  const T={天府:0,太陰:1,貪狼:2,巨門:3,天相:4,天梁:5,七殺:6,破軍:10};
  const tf=mod(4-zw,12);
  Object.keys(Z).forEach(k=>put(k,zw+Z[k]));
  Object.keys(T).forEach(k=>put(k,tf+T[k]));
  return{stem,br,ming,shen,stemOf,ny,ju,zw,at,ly,lm,ld,hi};
}

function sunLon(jd){
  const T=(jd-2451545)/36525,rad=Math.PI/180;
  const L0=280.46646+36000.76983*T+0.0003032*T*T;
  const M=(357.52911+35999.05029*T-0.0001537*T*T)*rad;
  const C=(1.914602-0.004817*T-0.000014*T*T)*Math.sin(M)+(0.019993-0.000101*T)*Math.sin(2*M)+0.000289*Math.sin(3*M);
  const om=(125.04-1934.136*T)*rad;
  return mod(L0+C-0.00569-0.00478*Math.sin(om),360);
}
function bazi(ds,hv){ // hv: -1 不知道, 0..11 時辰, 12 晚子時；由 lunar-javascript 精確節氣排盤
  const [Y,M,D]=ds.split('-').map(Number);
  const H=hv<0?12:hv===12?23:hv*2;
  const lunar=LUNAR.Solar.fromYmdHms(Y,M,D,H,hv<0?0:30,0).getLunar();
  const ec=lunar.getEightChar();ec.setSect(1);
  const ix=g=>[STEMS.indexOf(g[0]),BR.indexOf(g[1])];
  return{y:ix(ec.getYear()),m:ix(ec.getMonth()),d:ix(ec.getDay()),h:hv<0?null:ix(ec.getTime()),ec,lunar};
}

function shishen(dm,s){
  const d=STEM_EL[dm],o=STEM_EL[s],same=(dm%2)===(s%2);let k;
  if(o===d)k=same?0:1;

/* ===== 梅花易數 ===== */
const XT=['乾','兌','離','震','巽','坎','艮','坤'];
const triOf=n=>XT[mod(n-1,8)];
const hexLines=(lo,up)=>[...TRI[lo][0],...TRI[up][0]].map(Number);
const hexFrom=L=>{const lo=TRIBY[L.slice(0,3).join('')],up=TRIBY[L.slice(3).join('')];return{lo,up,h:HEX[up+lo]}};
const hexDraw=(L,mv)=>`<div class="hx">${L.map((v,i)=>({v,i})).reverse().map(o=>`<div class="hl ${o.v?'yang':'yin'}"><i></i>${o.v?'':'<i></i>'}${mv===o.i+1?'<em>○</em>':''}</div>`).join('')}</div>`;
VIEWS.meihua={t:'梅花易數.exe',render:()=>`
<div class="center">${wa('梅花易數','wa6','arch')}</div>
<div class="pane"><p class="center">心裡想著一件事，選擇起卦方式：</p>
<div class="row"><label><input type="radio" name="m" value="t" checked> 以現在時間起卦</label>
<label><input type="radio" name="m" value="n"> 以兩個數字起卦</label></div>
<div class="row"><label>第一個數字 <input type="number" id="n1" min="1" max="999" value="" style="width:5em"></label>
<label>第二個數字 <input type="number" id="n2" min="1" max="999" value="" style="width:5em"></label></div>
<p class="small center">數字隨心所欲，想到什麼寫什麼。</p>
<div class="center"><button class="btn big" id="go">起卦</button></div></div>
<div id="out"></div>${backBtn}`,
mount(r){
  const out=$('#out',r);
  $('#go',r).onclick=()=>{
    const mode=$('input[name=m]:checked',r).value;
    let up,lo,mv,how;
    if(mode==='t'){
      const now=new Date(),l=lunarOf(now),yb=mod(l.y-4,12)+1,hb=Math.floor(((now.getHours()+1)%24)/2)+1;
      const a=yb+l.m+l.d;
      up=triOf(a);lo=triOf(a+hb);mv=mod(a+hb-1,6)+1;
      how=`以現在時間（農曆${lunarText(l)}・${BR[hb-1]}時）起卦`;
    }else{
      const a=parseInt($('#n1',r).value,10),b=parseInt($('#n2',r).value,10);
      if(!(a>0)||!(b>0)){out.innerHTML='<div class="pane center">請先填入兩個數字。</div>';refresh(out);return}
      up=triOf(a);lo=triOf(b);mv=mod(a+b-1,6)+1;how=`以數字 ${a}、${b} 起卦`;
    }
    const L=hexLines(lo,up),A=hexFrom(L);
    const L2=L.slice();L2[mv-1]=L2[mv-1]?0:1;const C=hexFrom(L2);
    const Hh=hexFrom([L[1],L[2],L[3],L[2],L[3],L[4]]);
    const card=(tag,x)=>`<p><span class="lbl">${tag}</span><b>${x.h[0]}卦</b>（上${x.up}下${x.lo}）：${x.h[3]}。</p>`;
    const YA=YJM[A.h[0]];
    const orig=YA?`<p><span class="lbl">卦辭</span>${YA[1]}</p><p><span class="lbl">動爻辭</span><b>${yname(mv-1,L[mv-1])}</b>：${YA[3][mv-1]}</p>`:'';
    out.innerHTML=`<div class="paper center"><p class="small">${how}</p>
    ${wa(A.h[0]+'卦','wa4','wave','clamp(46px,14vw,72px)')}${hexDraw(L,mv)}
    <p>第 <b>${cn(mv)}</b> 爻是動爻（○）。</p>
    <div style="text-align:left">${card('本卦・現況',A)}${orig}${card('互卦・過程',Hh)}${card('變卦・結果',C)}</div>
    <p class="small" style="text-align:left">※ 依邵雍梅花易數的起卦法簡化，卦辭與爻辭取自公有領域的《易經》，沒有細論體用生剋，僅供娛樂參考。</p></div>`;
    refresh(out);out.scrollIntoView({behavior:'smooth',block:'start'});
  };
}};

const HE6=[[0,1],[2,11],[3,10],[4,9],[5,8],[6,7]],HE3=[[8,0,4],[11,3,7],[2,6,10],[5,9,1]],HAI=[[0,7],[1,6],[2,5],[3,4],[8,11],[9,10]],PO=[[0,9],[1,4],[2,11],[3,6],[5,8],[7,10]],XING3=[[2,5,8],[1,10,7]],ZIXING=[4,6,9,11];
const inPair=(L,a,b)=>L.some(p=>p.includes(a)&&p.includes(b));
function relB(a,b){
  const d=a!==b;
  return{zhi:!d,chong:mod(a+6,12)===b,he6:d&&inPair(HE6,a,b),he3:d&&HE3.some(g=>g.includes(a)&&g.includes(b)),hai:d&&inPair(HAI,a,b),po:d&&inPair(PO,a,b),
    xing:d?(XING3.some(g=>g.includes(a)&&g.includes(b))||(a+b===3&&(a===0||b===0))):ZIXING.includes(a)};
}

/* ---------- 路由與外框 ---------- */
let cur='home';
function go(id){cur=id;route()}
function route(){
  const id=cur;
  const v=VIEWS[id]||VIEWS.home;
  const w=document.createElement('div');w.className='win';
  w.innerHTML=`<div class="tb"><span class="ttl nozy-cell">${v.t}</span><span class="tbtn">_</span><span class="tbtn">□</span><a class="tbtn" data-go="home" tabindex="0" title="關閉">✕</a></div><div class="body">${v.render()}</div>`;
  app.replaceChildren(w);
  v.mount&&v.mount(w);
  refresh(w);
  $('#cur').textContent=v.t.replace('.exe','');
  $('#menu').classList.remove('on');
  window.scrollTo(0,0);
}
function setZy(on){ROOT.classList.toggle('nozy',!on);$('#zytog').textContent='ㄅㄆㄇ '+(on?'開':'關');store.set('zy',on?'1':'0')}
function clock(){const d=new Date();$('#clock').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
$('#menulist').innerHTML=LIST.map(l=>`<a data-go="${l[0]}" tabindex="0">${l[1]} ${l[2]}</a>`).join('')+'<hr><a data-go="home" tabindex="0">🖥️ 回到桌面</a>';
$('#start').onclick=e=>{e.stopPropagation();$('#menu').classList.toggle('on')};
document.addEventListener('click',e=>{if(!e.target.closest('#menu'))$('#menu').classList.remove('on')});
$('#zytog').onclick=()=>setZy(ROOT.classList.contains('nozy'));
setZy(store.get('zy','1')==='1');clock();setInterval(clock,20000);
ROOT.addEventListener('click',e=>{const a=e.target.closest('[data-go]');if(a){e.preventDefault();go(a.dataset.go)}});
ROOT.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[data-go]')){e.preventDefault();go(e.target.dataset.go)}});
route();
})();
</script>
