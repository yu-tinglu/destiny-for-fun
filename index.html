      var oi = minute;
      var os = second;
      lunarYear *= 1;
      if(isNaN(lunarYear)){
        throw new Error('wrong lunar year '+oy);
      }
      lunarMonth *= 1;
      if(isNaN(lunarMonth)){
        throw new Error('wrong lunar month '+om);
      }
      lunarDay *= 1;
      if(isNaN(lunarDay)){
        throw new Error('wrong lunar day '+od);
      }
      hour *= 1;
      if(isNaN(hour)){
        throw new Error('wrong hour '+oh);
      }
      minute *= 1;
      if(isNaN(minute)){
        throw new Error('wrong minute '+oi);
      }
      second *= 1;
      if(isNaN(second)){
        throw new Error('wrong second '+os);
      }
      if(hour<0||hour>23){
        throw new Error('wrong hour '+hour);
      }
      if(minute<0||minute>59){
        throw new Error('wrong minute '+minute);
      }
      if(second<0||second>59){
        throw new Error('wrong second '+second);
      }

      var m = y.getMonth(lunarMonth);
      if (null == m) {

        _getYearNineStar:function(yearInGanZhi){
          var indexExact = LunarUtil.getJiaZiIndex(yearInGanZhi) + 1;
          var index = LunarUtil.getJiaZiIndex(this.getYearInGanZhi()) + 1;
          var yearOffset = indexExact - index;
          if (yearOffset > 1) {
            yearOffset -= 60;
          } else if (yearOffset < -1) {
            yearOffset += 60;
          }
          var yuan = Math.floor((this._p.year + yearOffset + 2696) / 60) % 3;
          var offset = (62 + yuan * 3 - indexExact) % 9;
          if(0 === offset){
            offset = 9;
          }
          return NineStar.fromIndex(offset - 1);
        },
        getYearNineStar:function(sect){
          var yearInGanZhi;
          switch (sect) {
            case 1:
              yearInGanZhi = this.getYearInGanZhi();
              break;
            case 3:
              yearInGanZhi = this.getYearInGanZhiExact();
              break;
            default:
              yearInGanZhi = this.getYearInGanZhiByLiChun();
          }
          return this._getYearNineStar(yearInGanZhi);

        getMonthNineStar:function(sect){
          var yearZhiIndex;
          var monthZhiIndex;
          switch (sect) {
            case 1:
              yearZhiIndex = this._p.yearZhiIndex;
              monthZhiIndex = this._p.monthZhiIndex;
              break;
            case 3:
              yearZhiIndex = this._p.yearZhiIndexExact;
              monthZhiIndex = this._p.monthZhiIndexExact;
              break;
            default:
              yearZhiIndex = this._p.yearZhiIndexByLiChun;
              monthZhiIndex = this._p.monthZhiIndex;
          }
          var n = 27 - (yearZhiIndex % 3 * 3);
          if (monthZhiIndex < LunarUtil.BASE_MONTH_ZHI_INDEX) {
            n -= 3;
          }
          return NineStar.fromIndex((n - monthZhiIndex) % 9);

        getDayNineStar:function(){
          var solarYmd = this._p.solar.toYmd();
          var dongZhi = this._getJieQiSolar(I18n.getMessage('jq.dongZhi'));
          var dongZhi2 = this._getJieQiSolar('DONG_ZHI');
          var xiaZhi = this._getJieQiSolar(I18n.getMessage('jq.xiaZhi'));
          var dongZhiIndex = LunarUtil.getJiaZiIndex(dongZhi.getLunar().getDayInGanZhi());
          var dongZhiIndex2 = LunarUtil.getJiaZiIndex(dongZhi2.getLunar().getDayInGanZhi());
          var xiaZhiIndex = LunarUtil.getJiaZiIndex(xiaZhi.getLunar().getDayInGanZhi());
          var solarShunBai;
          var solarShunBai2;
          var solarNiZi;
          if (dongZhiIndex>29) {
            solarShunBai = dongZhi.next(60 - dongZhiIndex);
          } else {
            solarShunBai = dongZhi.next(-dongZhiIndex);
          }
          var solarShunBaiYmd = solarShunBai.toYmd();
          if (dongZhiIndex2>29) {
            solarShunBai2 = dongZhi2.next(60 - dongZhiIndex2);
          } else {
            solarShunBai2 = dongZhi2.next(-dongZhiIndex2);
          }
          var solarShunBaiYmd2 = solarShunBai2.toYmd();
          if (xiaZhiIndex>29) {
            solarNiZi = xiaZhi.next(60 - xiaZhiIndex);
          } else {
            solarNiZi = xiaZhi.next(-xiaZhiIndex);
          }
          var solarNiZiYmd = solarNiZi.toYmd();
          var offset = 0;
          if (solarYmd >= solarShunBaiYmd && solarYmd < solarNiZiYmd) {
            offset = this._p.solar.subtract(solarShunBai) % 9;
          } else if (solarYmd >= solarNiZiYmd && solarYmd < solarShunBaiYmd2){
            offset = 8 - (this._p.solar.subtract(solarNiZi) % 9);
          } else if (solarYmd >= solarShunBaiYmd2) {
            offset = this._p.solar.subtract(solarShunBai2) % 9;
          } else if (solarYmd < solarShunBaiYmd) {
            offset = (8 + solarShunBai.subtract(this._p.solar)) % 9;
          }
          return NineStar.fromIndex(offset);
        },
        getTimeNineStar:function(){
          var solarYmd = this._p.solar.toYmd();
          var asc = false;
          if((solarYmd >= this._getJieQiSolar(I18n.getMessage('jq.dongZhi')).toYmd() && solarYmd < this._getJieQiSolar(I18n.getMessage('jq.xiaZhi')).toYmd()) || solarYmd >= this._getJieQiSolar('DONG_ZHI').toYmd()){

          var start = offset[this.getDayZhiIndex() % 3];

          var index = asc ? (start + timeZhiIndex) : (start + 9 - timeZhiIndex);
          return NineStar.fromIndex(index % 9);

        _buildJieQi:function(name, solar){
          var jie=false;
          var qi=false;
          for(var i=0,j=LunarUtil.JIE_QI.length;i<j;i++){
            if(LunarUtil.JIE_QI[i]===name){
              if(i%2===0){
                qi = true;
              }else{
                jie = true;
              }
              break;
            }
          }
          return {
            _p: {
              name: name,
              solar: solar,
              jie: jie,
              qi: qi
            },
            getName: function(){return this._p.name;},
            getSolar: function(){return this._p.solar;},
            setName: function(name){this._p.name=name;},
            setSolar: function(solar){this._p.solar=solar;},
            isJie: function(){return this._p.jie;},
            isQi: function(){return this._p.qi;},
            toString: function(){return this.getName();}
          };
        },
        _getNearJieQi:function(forward, conditions, wholeDay){
          var name = null;
          var near = null;
          var filters = {};
          var filter = false;
          if(null!=conditions){
            for(var i=0,j=conditions.length;i<j;i++){
              filters[conditions[i]] = true;
              filter = true;
            }
          }
          var today = this._p.solar[wholeDay ? 'toYmd' : 'toYmdHms']();
          for(var key in this._p.jieQi){
            var jq = this._convertJieQi(key);
            if(filter){
              if(!filters[jq]){
                continue;
              }
            }
            var solar = this._getJieQiSolar(key);
            var day = solar[wholeDay ? 'toYmd' : 'toYmdHms']();
            if(forward){
              if(day<=today){
                continue;
              }
              if(null == near || day < near[wholeDay ? 'toYmd' : 'toYmdHms']()){
                name = jq;
                near = solar;
              }
            }else{
              if(day>today){
                continue;
              }
              if(null == near || day > near[wholeDay ? 'toYmd' : 'toYmdHms']()) {
                name = jq;
                near = solar;
              }
            }
          }
          if(null==near){
            return null;
          }
          return this._buildJieQi(name, near);
        },

        toFullString:function(){

      XIU_SONG:{
        '{xx.jiao}': '角星造作主荣昌，外进田财及女郎，嫁娶婚姻出贵子，文人及第见君王，惟有埋葬不可用，三年之后主瘟疫，起工修筑坟基地，堂前立见主人凶。',
        '{xx.kang}': '亢星造作长房当，十日之中主有殃，田地消磨官失职，接运定是虎狼伤，嫁娶婚姻用此日，儿孙新妇守空房，埋葬若还用此日，当时害祸主重伤。',
        '{xx.di}': '氐星造作主灾凶，费尽田园仓库空，埋葬不可用此日，悬绳吊颈祸重重，若是婚姻离别散，夜招浪子入房中，行船必定遭沉没，更生聋哑子孙穷。',
        '{xx.fang}': '房星造作田园进，钱财牛马遍山岗，更招外处田庄宅，荣华富贵福禄康，埋葬若然用此日，高官进职拜君王，嫁娶嫦娥至月殿，三年抱子至朝堂。',
        '{xx.xin}': '心星造作大为凶，更遭刑讼狱囚中，忤逆官非宅产退，埋葬卒暴死相从，婚姻若是用此日，子死儿亡泪满胸，三年之内连遭祸，事事教君没始终。',
        '{xx.tail}': '尾星造作主天恩，富贵荣华福禄增，招财进宝兴家宅，和合婚姻贵子孙，埋葬若能依此日，男清女正子孙兴，开门放水招田宅，代代公侯远播名。',
        '{xx.ji}': '箕星造作主高强，岁岁年年大吉昌，埋葬修坟大吉利，田蚕牛马遍山岗，开门放水招田宅，箧满金银谷满仓，福荫高官加禄位，六亲丰禄乐安康。',
        '{xx.dou}': '斗星造作主招财，文武官员位鼎台，田宅家财千万进，坟堂修筑贵富来，开门放水招牛马，旺蚕男女主和谐，遇此吉宿来照护，时支福庆永无灾。',
        '{xx.niu}': '牛星造作主灾危，九横三灾不可推，家宅不安人口退，田蚕不利主人衰，嫁娶婚姻皆自损，金银财谷渐无之，若是开门并放水，牛猪羊马亦伤悲。',
        '{xx.nv}': '女星造作损婆娘，兄弟相嫌似虎狼，埋葬生灾逢鬼怪，颠邪疾病主瘟惶，为事遭官财失散，泻利留连不可当，开门放水用此日，全家财散主离乡。',
        '{xx.xu}': '虚星造作主灾殃，男女孤眠不一双，内乱风声无礼节，儿孙媳妇伴人床，开门放水遭灾祸，虎咬蛇伤又卒亡，三三五五连年病，家破人亡不可当。',
        '{xx.wei}': '危星不可造高楼，自遭刑吊见血光，三年孩子遭水厄，后生出外永不还，埋葬若还逢此日，周年百日取高堂，三年两载一悲伤，开门放水到官堂。',
        '{xx.shi}': '室星修造进田牛，儿孙代代近王侯，家贵荣华天上至，寿如彭祖八千秋，开门放水招财帛，和合婚姻生贵儿，埋葬若能依此日，门庭兴旺福无休。',
        '{xx.qiang}': '壁星造作主增财，丝蚕大熟福滔天，奴婢自来人口进，开门放水出英贤，埋葬招财官品进，家中诸事乐陶然，婚姻吉利主贵子，早播名誉著祖鞭。',
        '{xx.kui}': '奎星造作得祯祥，家内荣和大吉昌，若是埋葬阴卒死，当年定主两三伤，看看军令刑伤到，重重官事主瘟惶，开门放水遭灾祸，三年两次损儿郎。',
        '{xx.lou}': '娄星修造起门庭，财旺家和事事兴，外进钱财百日进，一家兄弟播高名，婚姻进益生贵子，玉帛金银箱满盈，放水开门皆吉利，男荣女贵寿康宁。',
        '{xx.vei}': '胃星造作事如何，家贵荣华喜气多，埋葬贵临官禄位，夫妇齐眉永保康，婚姻遇此家富贵，三灾九祸不逢他，从此门前多吉庆，儿孙代代拜金阶。',
        '{xx.mao}': '昴星造作进田牛，埋葬官灾不得休，重丧二日三人死，尽卖田园不记增，开门放水招灾祸，三岁孩儿白了头，婚姻不可逢此日，死别生离是可愁。',
        '{xx.bi}': '毕星造作主光前，买得田园有余钱，埋葬此日添官职，田蚕大熟永丰年，开门放水多吉庆，合家人口得安然，婚姻若得逢此日，生得孩儿福寿全。',
        '{xx.zi}': '觜星造作有徒刑，三年必定主伶丁，埋葬卒死多因此，取定寅年使杀人，三丧不止皆由此，一人药毒二人身，家门田地皆退败，仓库金银化作尘。',
        '{xx.can}': '参星造作旺人家，文星照耀大光华，只因造作田财旺，埋葬招疾哭黄沙，开门放水加官职，房房子孙见田加，婚姻许遁遭刑克，男女朝开幕落花。',
        '{xx.jing}': '井星造作旺蚕田，金榜题名第一光，埋葬须防惊卒死，狂颠风疾入黄泉，开门放水招财帛，牛马猪羊旺莫言，贵人田塘来入宅，儿孙兴旺有余钱。',
        '{xx.gui}': '鬼星起造卒人亡，堂前不见主人郎，埋葬此日官禄至，儿孙代代近君王，开门放水须伤死，嫁娶夫妻不久长，修土筑墙伤产女，手扶双女泪汪汪。',
        '{xx.liu}': '柳星造作主遭官，昼夜偷闭不暂安，埋葬瘟惶多疾病，田园退尽守冬寒，开门放水遭聋瞎，腰驼背曲似弓弯，更有棒刑宜谨慎，妇人随客走盘桓。',
        '{xx.xing}': '星宿日好造新房，进职加官近帝王，不可埋葬并放水，凶星临位女人亡，生离死别无心恋，要自归休别嫁郎，孔子九曲殊难度，放水开门天命伤。',
        '{xx.zhang}': '张星日好造龙轩，年年并见进庄田，埋葬不久升官职，代代为官近帝前，开门放水招财帛，婚姻和合福绵绵，田蚕人满仓库满，百般顺意自安然。',
        '{xx.yi}': '翼星不利架高堂，三年二载见瘟惶，埋葬若还逢此日，子孙必定走他乡，婚姻此日不宜利，归家定是不相当，开门放水家须破，少女恋花贪外郎。',
        '{xx.zhen}': '轸星临水造龙宫，代代为官受皇封，富贵荣华增寿禄，库满仓盈自昌隆，埋葬文昌来照助，宅舍安宁不见凶，更有为官沾帝宠，婚姻龙子入龙宫。'
      },

，利用侵伐，無不利。","鳴謙，利用行師，征邑國。"]],["豫","利建侯行師。","雷出地奮，豫。先王以作樂崇德，殷薦之上帝，以配祖考。",["鳴豫，凶。","介于石，不終日，貞吉。","盱豫，悔。遲有悔。","由豫，大有得。勿疑。朋盍簪。","貞疾，恆不死。","冥豫，成有渝，無咎。"]],["隨","元亨利貞，無咎。","澤中有雷，隨；君子以嚮晦入宴息。",["官有渝，貞吉。出門交有功。","係小子，失丈夫。","係丈夫，失小子。隨有求得，利居貞。","隨有獲，貞凶。有孚在道，以明，何咎。","孚于嘉，吉。","拘系之，乃從維之。王用亨于西山。"]],["蠱","元亨，利涉大川。先甲三日，後甲三日。","山下有風，蠱；君子以振民育德。",["幹父之蠱，有子，考無咎，厲終吉。","幹母之蠱，不可貞。","幹父小有晦，無大咎。","裕父之蠱，往見吝。","幹父之蠱，用譽。","不事王侯，高尚其事。"]],["臨","元，亨，利，貞。至于八月有凶。","澤上有地，臨；君子以教思無窮，容保民無疆。",["咸臨，貞吉。","咸臨，吉無不利。","甘臨，無攸利。既憂之，無咎。","至臨，無咎。","知臨，大君之宜，吉。","敦臨，吉無咎。"]],["觀","盥而不薦，有孚顒若。","風行地上，觀；先王以省方，觀民設教。",["童觀，小人無咎，君子吝。","窺觀，利女貞。","觀我生，進退。","觀國之光，利用賓于王。","觀我生，君子無咎。","觀其生，君子無咎。"]],["噬嗑","亨。利用獄。","雷電噬嗑；先王以明罰敕法。",["履校滅趾，無咎。","噬膚滅鼻，無咎。","噬臘肉，遇毒；小吝，無咎。","噬乾胏，得金矢，利艱貞，吉。","噬乾肉，得黃金，貞厲，無咎。","何校滅耳，凶。"]],["賁","亨。小利有所往。","山下有火，賁；君子以明庶政，無敢折獄。",["賁其趾，舍車而徒。","賁其須。","賁如濡如，永貞吉。","賁如皤如，白馬翰如，匪寇婚媾。","賁于丘園，束帛戔戔，吝，終吉。","白賁，無咎。"]],["剝","不利有攸往。","山附于地，剝；上以厚下，安宅。",["剝床以足，蔑貞凶。","剝床以辨，蔑貞凶。","剝之，無咎。","剝床以膚，凶。","貫魚，以宮人寵，無不利。","碩果不食，君子得輿，小人剝廬。"]],["復","亨。出入無疾，朋來無咎。反復其道，七日來復，利有攸往。","雷在地中，復；先王以至日閉關，商旅不行，后不省方。",["不復遠，無祗悔，元吉。","休復，吉。","頻復厲，無咎。","中行獨復。","敦復，無悔。","迷復，凶，有災眚。用行師，終有大敗，以其國君，凶；至于十年，不克征。"]],["無妄","元，亨，利，貞。其匪正有眚，不利有攸往。","天下雷行，物與無妄；先王以茂對時，育萬物。",["無妄，往吉。","不耕獲，不菑畬，則利有攸往。","無妄之災，或繫之牛，行人之得，邑人之災。","可貞，無咎。","無妄之疾，勿藥有喜。","無妄，行有眚，無攸利。"]],["大畜","利貞，不家食吉，利涉大川。","天在山中，大畜；君子以多識前言往行，以畜其德。",["有厲利已。","輿說輻。","良馬逐，利艱貞。日閑輿衛，利有攸往。","童牛之牿，元吉。","豶豕之牙，吉。","何天之衢，亨。"]],["頤","貞吉。觀頤，自求口實。","山下有雷，頤；君子以慎言語，節飲食。",["舍爾靈龜，觀我朵頤，凶。","顛頤，拂經于丘頤，征凶。","拂頤，貞凶，十年勿用，無攸利。","顛頤吉，虎視眈眈，其欲逐逐，無咎。","拂經，居貞吉，不可涉大川。","由頤，厲吉，利涉大川。"]],["大過","棟橈，利有攸往，亨。","澤滅木，大過；君子以獨立不懼，遯世無悶。",["藉用白茅，無咎。","枯楊生稊，老夫得其女妻，無不利。","棟橈，凶。","棟隆，吉；有它吝。","枯楊生華，老婦得士夫，無咎無譽。","過涉滅頂，凶，無咎。"]],["坎","習坎，有孚，維心亨，行有尚。","水洊至，習坎；君子以常德行，習教事。",["習坎，入于坎窞，凶。","坎有險，求小得。","來之坎坎，險且枕，入于坎窞，勿用。","樽酒簋貳，用缶，納約自牖，終無咎。","坎不盈，祗既平，無咎。","係用徽纆，寘于叢棘，三歲不得，凶。"]],["離","利貞，亨。畜牝牛，吉。","明兩作離，大人以繼明照于四方。",["履錯然，敬之無咎。","黃離，元吉。","日昃之離，不鼓缶而歌，則大耋之嗟，凶。","突如其來如，焚如，死如，棄如。","出涕沱若，戚嗟若，吉。","王用出征，有嘉折首，獲匪其醜，無咎。"]],["咸","亨，利貞，取女吉。","山上有澤，咸；君子以虛受人。",["咸其拇。","咸其腓，凶，居吉。","咸其股，執其隨，往吝。","貞吉悔亡，憧憧往來，朋從爾思。","咸其脢，無悔。","咸其輔，頰，舌。"]],["恆","亨，無咎，利貞，利有攸往。","雷風，恆；君子以立不易方。",["浚恆，貞凶，無攸利。","悔亡。","不恆其德，或承之羞，貞吝。","田無禽。","恆其德，貞，婦人吉，夫子凶。","振恆，凶。"]],["遯","亨，小利貞。","天下有山，遯；君子以遠小人，不惡而嚴。",["遯尾，厲，勿用有攸往。","執之用黃牛之革，莫之勝說。","係遯，有疾厲，畜臣妾吉。","好遯君子吉，小人否。","嘉遯，貞吉。","肥遯，無不利。"]],["大壯","利貞。","雷在天上，大壯；君子以非禮弗履。",["壯于趾，征凶，有孚。","貞吉。","小人用壯，君子用罔，貞厲。羝羊觸藩，羸其角。","貞吉悔亡，藩決不羸，壯于大輿之輹。","喪羊于易，無悔。","羝羊觸藩，不能退，不能遂，無攸利，艱則吉。"]],["晉","康侯用錫馬蕃庶，晝日三接。","明出地上，晉；君子以自昭明德。",["晉如，摧如，貞吉。罔孚，裕無咎。","晉如，愁如，貞吉。受茲介福，于其王母。","眾允，悔亡。","晉如鼫鼠，貞厲。","悔亡，失得勿恤，往吉無不利。","晉其角，維用伐邑，厲吉無咎，貞吝。"]],["明夷","利艱貞。","明入地中，明夷；君子以蒞眾，用晦而明。",["明夷于飛，垂其翼。君子于行，三日不食，有攸往，主人有言。","明夷，夷于左股，用拯馬壯，吉。","明夷于南狩，得其大首，不可疾貞。","入于左腹，獲明夷之心，于出門庭。","箕子之明夷，利貞。","不明晦，初登于天，後入于地。"]],["家人","利女貞。","風自火出，家人；君子以言有物，而行有恆。",["閑有家，悔亡。","無攸遂，在中饋，貞吉。","家人嗃嗃，悔厲吉；婦子嘻嘻，終吝。","富家，大吉。","王假有家，勿恤吉。","有孚威如，終吉。"]],["睽","小事吉。","上火下澤，睽；君子以同而異。",["悔亡，喪馬勿逐，自復；見惡人無咎。","遇主于巷，無咎。","見輿曳，其牛掣，其人天且劓，無初有終。","睽孤，遇元夫，交孚，厲無咎。","悔亡，厥宗噬膚，往何咎。","睽孤，見豕負塗，載鬼一車，先張之弧，後說之弧，匪寇婚媾，往遇雨則吉。"]],["蹇","利西南，不利東北；利見大人，貞吉。","山上有水，蹇；君子以反身修德。",["往蹇，來譽。","王臣蹇蹇，匪躬之故。","往蹇來反。","往蹇來連。","大蹇朋來。","往蹇來碩，吉；利見大人。"]],["解","利西南，無所往，其來復吉。有攸往，夙吉。","雷雨作，解；君子以赦過宥罪。",["無咎。","田獲三狐，得黃矢，貞吉。","負且乘，致寇至，貞吝。","解而拇，朋至斯孚。","君子維有解，吉；有孚于小人。","公用射隼，于高墉之上，獲之，無不利。"]],["損","有孚，元吉，無咎，可貞，利有攸往？曷之用，二簋可用享。","山下有澤，損；君子以懲忿窒欲。",["已事遄往，無咎，酌損之。","利貞，征凶，弗損益之。","三人行，則損一人；一人行，則得其友。","損其疾，使遄有喜，無咎。","或益之，十朋之龜弗克違，元吉。","弗損益之，無咎，貞吉，利有攸往，得臣無家。"]],["益","利有攸往，利涉大川。","風雷，益；君子以見善則遷，有過則改。",["利用為大作，元吉，無咎。","或益之，十朋之龜弗克違，永貞吉。王用享于帝，吉。","益之用凶事，無咎。有孚中行，告公用圭。","中行，告公從。利用為依遷國。","有孚惠心，勿問元吉。有孚惠我德。","莫益之，或擊之，立心勿恆，凶。"]],["夬","揚于王庭，孚號，有厲，告自邑，不利即戎，利有攸往。","澤上于天，夬；君子以施祿及下，居德則忌。",["壯于前趾，往不勝為吝。","惕號，莫夜有戎，勿恤。","壯于頄，有凶。君子夬夬，獨行遇雨，若濡有慍，無咎。","臀無膚，其行次且。牽羊悔亡，聞言不信。","莧陸夬夬，中行無咎。","無號，終有凶。"]],["姤","女壯，勿用取女。","天下有風，姤；后以施命誥四方。",["繫于金柅，貞吉，有攸往，見凶，羸豕孚蹢躅。","包有魚，無咎，不利賓。","臀無膚，其行次且，厲，無大咎。","包無魚，起凶。","以杞包瓜，含章，有隕自天。","姤其角，吝，無咎。"]],["萃","亨。王假有廟，利見大人，亨，利貞。用大牲吉，利有攸往。","澤上於地，萃；君子以除戎器，戒不虞。",["有孚不終，乃亂乃萃，若號一握為笑，勿恤，往無咎。","引吉，無咎，孚乃利用禴。","萃如，嗟如，無攸利，往無咎，小吝。","大吉，無咎。","萃有位，無咎。匪孚，元永貞，悔亡。","齎咨涕洟，無咎。"]],["升","元亨，用見大人，勿恤，南征吉。","地中生木，升；君子以順德，積小以高大。",["允升，大吉。","孚乃利用禴，無咎。","升虛邑。","王用亨于岐山，吉無咎。","貞吉，升階。","冥升，利于不息之貞。"]],["困","亨，貞，大人吉，無咎，有言不信。","澤無水，困；君子以致命遂志。",["臀困于株木，入于幽谷，三歲不覿。","困于酒食，朱紱方來，利用亨祀，征凶，無咎。","困于石，據于蒺藜，入于其宮，不見其妻，凶。","來徐徐，困于金車，吝，有終。","劓刖，困于赤紱，乃徐有說，利用祭祀。","困于葛藟，于臲卼，曰動悔。有悔，征吉。"]],["井","改邑不改井，無喪無得，往來井井。汔至，亦未繘井，羸其瓶，凶。","木上有水，井；君子以勞民勸相。",["井泥不食，舊井無禽。","井谷射鮒，甕敝漏。","井渫不食，為我民惻，可用汲，王明，並受其福。","井甃，無咎。","井冽，寒泉食。","井收勿幕，有孚無吉。"]],["革","己日乃孚，元亨利貞，悔亡。","澤中有火，革；君子以治歷明時。",["鞏用黃牛之革。","己日乃革之，征吉，無咎。","征凶，貞厲，革言三就，有孚。","悔亡，有孚改命，吉。","大人虎變，未占有孚。","君子豹變，小人革面，征凶，居貞吉。"]],["鼎","元吉，亨。","木上有火，鼎；君子以正位凝命。",["鼎顛趾，利出否，得妾以其子，無咎。","鼎有實，我仇有疾，不我能即，吉。","鼎耳革，其行塞，雉膏不食，方雨虧悔，終吉。","鼎折足，覆公餗，其形渥，凶。","鼎黃耳金鉉，利貞。","鼎玉鉉，大吉，無不利。"]],["震","亨。震來虩虩，笑言啞啞。震驚百里，不喪匕鬯。","洊雷，震；君子以恐懼修身。",["震來虩虩，後笑言啞啞，吉。","震來厲，億喪貝，躋于九陵，勿逐，七日得。","震蘇蘇，震行無眚。","震遂泥。","震往來厲，億無喪，有事。","震索索，視矍矍，征凶。震不于其躬，于其鄰，無咎。婚媾有言。"]],["艮","艮其背，不獲其身，行其庭，不見其人，無咎。","兼山，艮；君子以思不出其位。",["艮其趾，無咎，利永貞。","艮其腓，不拯其隨，其心不快。","艮其限，列其夤，厲薰心。","艮其身，無咎。","艮其輔，言有序，悔亡。","敦艮，吉。"]],["漸","女歸吉，利貞。","山上有木，漸；君子以居賢德，善俗。",["鴻漸于干，小子厲，有言，無咎。","鴻漸于磐，飲食衎衎，吉。","鴻漸于陸，夫征不復，婦孕不育，凶；利御寇。","鴻漸于木，或得其桷，無咎。","鴻漸于陵，婦三歲不孕，終莫之勝，吉。","鴻漸于逵，其羽可用為儀，吉。"]],["歸妹","征凶，無攸利。","澤上有雷，歸妹；君子以永終知敝。",["歸妹以娣，跛能履，征吉。","眇能視，利幽人之貞。","歸妹以須，反歸以娣。","歸妹愆期，遲歸有時。","帝乙歸妹，其君之袂，不如其娣之袂良，月幾望，吉。","女承筐無實，士刲羊無血，無攸利。"]],["豐","亨，王假之，勿憂，宜日中。","雷電皆至，豐；君子以折獄致刑。",["遇其配主，雖旬無咎，往有尚。","豐其蔀，日中見斗，往得疑疾，有孚發若，吉。","豐其沛，日中見沫，折其右肱，無咎。","豐其蔀，日中見斗，遇其夷主，吉。","來章，有慶譽，吉。","豐其屋，蔀其家，窺其戶，闃其無人，三歲不覿，凶。"]],["旅","小亨，旅貞吉。","山上有火，旅；君子以明慎用刑，而不留獄。",["旅瑣瑣，斯其所取災。","旅即次，懷其資，得童僕貞。","旅焚其次，喪其童僕，貞厲。","旅于處，得其資斧，我心不快。","射雉一矢亡，終以譽命。","鳥焚其巢，旅人先笑後號咷。喪牛于易，凶。"]],["巽","小亨，利攸往，利見大人。","隨風，巽；君子以申命行事。",["進退，利武人之貞。","巽在床下，用史巫紛若，吉無咎。","頻巽，吝。","悔亡，田獲三品。","貞吉悔亡，無不利。無初有終，先庚三日，後庚三日，吉。","巽在床下，喪其資斧，貞凶。"]],["兌","亨，利貞。","麗澤，兌；君子以朋友講習。",["和兌，吉。","孚兌，吉，悔亡。","來兌，凶。","商兌，未寧，介疾有喜。","孚于剝，有厲。","引兌。"]],["渙","亨。王假有廟，利涉大川，利貞。","風行水上，渙；先王以享于帝立廟。",["用拯馬壯，吉。","渙奔其機，悔亡。","渙其躬，無悔。","渙其群，元吉。渙有丘，匪夷所思。","渙汗其大號，渙王居，無咎。","渙其血，去逖出，無咎。"]],["節","亨。苦節不可貞。","澤上有水，節；君子以制數度，議德行。",["不出戶庭，無咎。","不出門庭，凶。","不節若，則嗟若，無咎。","安節，亨。","甘節，吉；往有尚。","苦節，貞凶，悔亡。"]],["中孚","豚魚，吉，利涉大川，利貞。","澤上有風，中孚；君子以議獄緩死。",["虞吉，有他不燕。","鳴鶴在陰，其子和之，我有好爵，吾與爾靡之。","得敵，或鼓或罷，或泣或歌。","月幾望，馬匹亡，無咎。","有孚攣如，無咎。","翰音登于天，貞凶。"]],["小過","亨，利貞，可小事，不可大事。飛鳥遺之音，不宜上宜下，大吉。","山上有雷，小過；君子以行過乎恭，喪過乎哀，用過乎儉。",["飛鳥以凶。","過其祖，遇其妣；不及其君，遇其臣；無咎。","弗過防之，從或戕之，凶。","無咎，弗過遇之。往厲必戒，勿用永貞。","密雲不雨，自我西郊，公弋取彼在穴。","弗遇過之，飛鳥離之，凶，是謂災眚。"]],["既濟","亨，小利貞，初吉終亂。","水在火上，既濟；君子以思患而預防之。",["曳其輪，濡其尾，無咎。","婦喪其茀，勿逐，七日得。","高宗伐鬼方，三年克之，小人勿用。","繻有衣袽，終日戒。","東鄰殺牛，不如西鄰之禴祭，實受其福。","濡其首，厲。"]],["未濟","亨，小狐汔濟，濡其尾，無攸利。","火在水上，未濟；君子以慎辨物居方。",["濡其尾，吝。","曳其輪，貞吉。","未濟，征凶，利涉大川。","貞吉，悔亡，震用伐鬼方，三年有賞于大國。","貞吉，無悔，君子之光，有孚，吉。","有孚于飲酒，無咎，濡其首，有孚失是。"]]];

function conv(t){
  const cs=[...t];let out='',i=0;
  while(i<cs.length){
    let hit=false;
    for(let n=4;n>=2&&!hit;n--){
      const w=cs.slice(i,i+n).join('');
      if(w.length===n&&WORDS[w]){for(let k=0;k<n;k++)out+=zc(cs[i+k],WORDS[w][k]);i+=n;hit=true}
    }
    if(hit)continue;
    const c=cs[i++];
    out+=isC(c)?zc(c,ZY[c]):esc(c);
  }
  return out;
}
const SKIP=new Set(['SCRIPT','STYLE','SELECT','OPTION','TEXTAREA','INPUT','TITLE']);
function annotate(root){
  const list=[];
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  while(w.nextNode()){
    const n=w.currentNode;
    if(!/[㐀-鿿]/.test(n.nodeValue))continue;
    let skip=false;
    for(let p=n.parentNode;p&&p!==ROOT.parentNode;p=p.parentNode){
      if(p.nodeType!==1)continue;
      if(SKIP.has(p.tagName)||(p.classList&&(p.classList.contains('nozy-cell')||p.classList.contains('z')))){skip=true;break}
    }
    if(!skip)list.push(n);
  }
  list.forEach(n=>{const t=document.createElement('template');t.innerHTML=conv(n.nodeValue);n.replaceWith(t.content)});
}
function waveify(root){
  $$('.wa[data-shape]',root).forEach(el=>{
    if(el.dataset.done)return;el.dataset.done=1;
    [...el.childNodes].forEach(n=>{
      if(n.nodeType===3){const f=document.createDocumentFragment();
        [...n.nodeValue].forEach(ch=>{const s=document.createElement('span');s.className='z';s.textContent=ch;f.append(s)});
        n.replaceWith(f)}
    });
    const u=[...el.children].filter(c=>c.classList.contains('z'));
    const N=u.length,shape=el.dataset.shape;
    u.forEach((c,i)=>{
      const t=N>1?i/(N-1):.5;let tr='';
      if(shape==='wave')tr=`translateY(${(Math.sin(t*Math.PI*2.4)*.16).toFixed(3)}em)`;
      else if(shape==='arch')tr=`translateY(${(-Math.sin(t*Math.PI)*.32+.12).toFixed(3)}em) rotate(${((t-.5)*26).toFixed(1)}deg)`;
      else if(shape==='slant')tr=`translateY(${((.5-t)*.5).toFixed(3)}em)`;
      else if(shape==='grow')tr=`scale(${(.78+t*.4).toFixed(3)})`;
      c.style.transform=tr;
    });
  });
}

function ziwei(ly,lm,ld,hi){
  const stem=mod(ly-4,10),br=mod(ly-4,12);
  const monthPos=mod(2+lm-1,12);
  const ming=mod(monthPos-hi,12),shen=mod(monthPos+hi,12);
  const s0=[2,4,6,8,0][stem%5];
  const stemOf=b=>(s0+mod(b-2,12))%10;
  const ms=stemOf(ming);let n=0;
  for(let i=0;i<60;i++)if(i%10===ms&&i%12===ming){n=i;break}
  const ny=NAYIN[Math.floor(n/2)];
  const ju={金:4,木:3,水:2,火:6,土:5}[ny[1]];
  let x=0;while((ld+x)%ju!==0)x++;
  const q=(ld+x)/ju,base=mod(q+1,12);
  const zw=x%2?mod(base-x,12):mod(base+x,12);
  const at={};
  const put=(nm,b)=>{(at[mod(b,12)]=at[mod(b,12)]||[]).push(nm)};
  const Z={紫微:0,天機:-1,太陽:-3,武曲:-4,天同:-5,廉貞:-8};
  const T={天府:0,太陰:1,貪狼:2,巨門:3,天相:4,天梁:5,七殺:6,破軍:10};
  const tf=mod(4-zw,12);
  Object.keys(Z).forEach(k=>put(k,zw+Z[k]));
  Object.keys(T).forEach(k=>put(k,tf+T[k]));
  return{stem,br,ming,shen,stemOf,ny,ju,zw,at,ly,lm,ld,hi};
}

/* 易經原典（卦辭、大象、爻辭）：Project Gutenberg 公有領域《易經》 */
const YJM={};YJ.forEach(y=>YJM[y[0]]=y);
const yname=(i,yang)=>i===0?'初'+(yang?'九':'六'):i===5?'上'+(yang?'九':'六'):(yang?'九':'六')+NUM[i+1];
function yjHTML(an,cn_,mv,bitsA,bitsC){
  const A=YJM[an];if(!A)return'';
  const C=cn_?YJM[cn_]:null,n=mv.length;
  const ln=(H,bits,i)=>`<p><b>${yname(i,bits[i])}</b>：${H[3][i]}</p>`;
  let rule='',body='';
  if(n===0){rule='沒有動爻，以本卦卦辭為準。'}
  else if(n===1){rule='一個動爻，以本卦動爻的爻辭為準。';body=ln(A,bitsA,mv[0])}
  else if(n===2){rule='兩個動爻，以本卦這兩爻的爻辭為準，以上面那爻為主。';body=ln(A,bitsA,mv[1])+ln(A,bitsA,mv[0])}
  else if(n===3){rule='三個動爻，以本卦與之卦的卦辭合看，本卦為主。';body=`<p><b>之卦「${C[0]}」卦辭</b>：${C[1]}</p>`}
  else if(n===4){const u=[0,1,2,3,4,5].filter(i=>!mv.includes(i));rule='四個動爻，以之卦兩個不變爻的爻辭為準，以下面那爻為主。';body=ln(C,bitsC,u[0])+ln(C,bitsC,u[1])}
  else if(n===5){const u=[0,1,2,3,4,5].find(i=>!mv.includes(i));rule='五個動爻，以之卦唯一不變爻的爻辭為準。';body=ln(C,bitsC,u)}
  else{
    if(an==='乾'||an==='坤'){rule=an==='乾'?'乾卦六爻皆動，看「用九」。':'坤卦六爻皆動，看「用六」。';body=`<p><b>${an==='乾'?'用九':'用六'}</b>：${A[3][6]}</p>`}
    else{rule='六爻皆動，以之卦卦辭為準。';body=`<p><b>之卦「${C[0]}」卦辭</b>：${C[1]}</p>`}
  }
  return`<div class="wa wa2 sm" data-shape="wave">《易經》原文</div>
  <p><span class="lbl">卦辭</span>${A[1]}</p><p><span class="lbl">大象</span>${A[2]}</p>
  <p><span class="lbl">取辭</span>${rule}</p>${body}`;
}

const shu=n=>{while(n>81)n-=80;return SHU[n-1]};
const E5=['木','火','土','金','水'];
const el5=n=>{const d=n%10;return d===0?4:Math.floor((d-1)/2)};
const gcol=g=>/大吉|^吉/.test(g)?'#060':g==='半吉'?'#a60':'#a00';
function relE(a,b){
  if(a===b)return['同',E5[a]+'與'+E5[b]+'相同'];
  if(b===(a+1)%5)return['生',E5[a]+'生'+E5[b]];
  if(a===(b+1)%5)return['生',E5[b]+'生'+E5[a]];
  if(b===(a+2)%5)return['剋',E5[a]+'剋'+E5[b]];
  return['剋',E5[b]+'剋'+E5[a]];
}
function grids(S,G){
  let tian,ren,di,wai;
  const zong=S.concat(G).reduce((a,b)=>a+b,0);
  if(S.length===1){
    tian=S[0]+1;ren=S[0]+G[0];
    if(G.length===1){di=G[0]+1;wai=2}else{di=G[0]+G[1];wai=G[1]+1}
  }else{
    tian=S[0]+S[1];ren=S[1]+G[0];
    if(G.length===1){di=G[0]+1;wai=S[0]+1}else{di=G[0]+G[1];wai=S[0]+G[1]}
  }
  return{tian,ren,di,wai,zong};
}

function sunLon(jd){
  const T=(jd-2451545)/36525,rad=Math.PI/180;
  const L0=280.46646+36000.76983*T+0.0003032*T*T;
  const M=(357.52911+35999.05029*T-0.0001537*T*T)*rad;
  const C=(1.914602-0.004817*T-0.000014*T*T)*Math.sin(M)+(0.019993-0.000101*T)*Math.sin(2*M)+0.000289*Math.sin(3*M);
  const om=(125.04-1934.136*T)*rad;
  return mod(L0+C-0.00569-0.00478*Math.sin(om),360);
}
function bazi(ds,hv){ // hv: -1 不知道, 0..11 時辰, 12 晚子時；由 lunar-javascript 精確節氣排盤
  const [Y,M,D]=ds.split('-').map(Number);
  const H=hv<0?12:hv===12?23:hv*2;
  const lunar=LUNAR.Solar.fromYmdHms(Y,M,D,H,hv<0?0:30,0).getLunar();
  const ec=lunar.getEightChar();ec.setSect(1);
  const ix=g=>[STEMS.indexOf(g[0]),BR.indexOf(g[1])];
  return{y:ix(ec.getYear()),m:ix(ec.getMonth()),d:ix(ec.getDay()),h:hv<0?null:ix(ec.getTime()),ec,lunar};
}
const STEM_EL=[0,0,1,1,2,2,3,3,4,4];
const BR_EL=[4,2,0,0,2,1,1,2,3,3,2,4];
const BR_MAIN=[9,5,0,1,4,2,3,5,6,7,4,8];
const TEN=['比肩','劫財','食神','傷官','偏財','正財','七殺','正官','偏印','正印'];
function shishen(dm,s){
  const d=STEM_EL[dm],o=STEM_EL[s],same=(dm%2)===(s%2);let k;
  if(o===d)k=same?0:1;
  else if(o===(d+1)%5)k=same?2:3;
  else if(o===(d+2)%5)k=same?4:5;
  else if((o+2)%5===d)k=same?6:7;
  else k=same?8:9;
  return TEN[k];
}

const HE6=[[0,1],[2,11],[3,10],[4,9],[5,8],[6,7]],HE3=[[8,0,4],[11,3,7],[2,6,10],[5,9,1]],HAI=[[0,7],[1,6],[2,5],[3,4],[8,11],[9,10]],PO=[[0,9],[1,4],[2,11],[3,6],[5,8],[7,10]],XING3=[[2,5,8],[1,10,7]],ZIXING=[4,6,9,11];
const inPair=(L,a,b)=>L.some(p=>p.includes(a)&&p.includes(b));
function relB(a,b){
  const d=a!==b;
  return{zhi:!d,chong:mod(a+6,12)===b,he6:d&&inPair(HE6,a,b),he3:d&&HE3.some(g=>g.includes(a)&&g.includes(b)),hai:d&&inPair(HAI,a,b),po:d&&inPair(PO,a,b),
    xing:d?(XING3.some(g=>g.includes(a)&&g.includes(b))||(a+b===3&&(a===0||b===0))):ZIXING.includes(a)};
}

  $('#pv',r).onclick=()=>shift(-1);$('#nx',r).onclick=()=>shift(1);$('#tdy',r).onclick=()=>{dt.value=f2(new Date());show()};
  show();
}};

/* ---------- 路由與外框 ---------- */
let cur='home';
function go(id){cur=id;route()}
function route(){
  const id=cur;
  const v=VIEWS[id]||VIEWS.home;
  const w=document.createElement('div');w.className='win';
  w.innerHTML=`<div class="tb"><span class="ttl nozy-cell">${v.t}</span><span class="tbtn">_</span><span class="tbtn">□</span><a class="tbtn" data-go="home" tabindex="0" title="關閉">✕</a></div><div class="body">${v.render()}</div>`;
  app.replaceChildren(w);
  v.mount&&v.mount(w);
  refresh(w);
  $('#cur').textContent=v.t.replace('.exe','');
  $('#menu').classList.remove('on');
  window.scrollTo(0,0);
}
function setZy(on){ROOT.classList.toggle('nozy',!on);$('#zytog').textContent='ㄅㄆㄇ '+(on?'開':'關');store.set('zy',on?'1':'0')}
function clock(){const d=new Date();$('#clock').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
$('#menulist').innerHTML=LIST.map(l=>`<a data-go="${l[0]}" tabindex="0">${l[1]} ${l[2]}</a>`).join('')+'<hr><a data-go="home" tabindex="0">🖥️ 回到桌面</a>';
$('#start').onclick=e=>{e.stopPropagation();$('#menu').classList.toggle('on')};
document.addEventListener('click',e=>{if(!e.target.closest('#menu'))$('#menu').classList.remove('on')});
$('#zytog').onclick=()=>setZy(ROOT.classList.contains('nozy'));
setZy(store.get('zy','1')==='1');clock();setInterval(clock,20000);
ROOT.addEventListener('click',e=>{const a=e.target.closest('[data-go]');if(a){e.preventDefault();go(a.dataset.go)}});
ROOT.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[data-go]')){e.preventDefault();go(e.target.dataset.go)}});
route();
})();
</script>
